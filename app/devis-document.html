<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Votre devis · BatiSpot</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!--
  Devis en bonne et due forme, consultable et imprimable par le CLIENT.

  Pourquoi cette page existe (01/09/2026) : la page de suivi montrait un total et une
  liste de prestations. Le client acceptait un recapitulatif, pas un document. Or un
  devis de travaux a des mentions obligatoires — arrete du 24 janvier 2017 et Code de
  la consommation — dont l'absence expose a 3 000 EUR d'amende pour une personne
  physique, 15 000 EUR pour une personne morale, et peut entrainer la nullite du contrat.

  Aucune bibliotheque PDF n'est chargee : le navigateur imprime en PDF nativement, sur
  mobile comme sur ordinateur. Une dependance de 300 Ko pour produire ce que le systeme
  fait deja n'aurait servi personne.

  Acces : ?t=<public_token du chantier>. Aucune session requise, comme suivi.html.
-->
<style>
  :root {
    --encre:#1C2B22; --gris:#5A7268; --trait:#D3E3DA; --trait-clair:#EEF3F0;
    --vert:#0F5132; --vert-clair:#F7FBF8; --alerte:#9B2C1C; --alerte-fond:#FDECEA;
    /* Couleur de l'artisan (pro_profiles.couleur) — repli vert BatiSpot si
       l'artisan n'a rien choisi. Posee sur :root en JS avant le rendu, elle
       remplace var(--vert) sur les accents du document (bandeau d'en-tete,
       filets, total) : le client lit LE devis de SON artisan, pas de BatiSpot. */
    --artisan:#228B5B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#EEF1EF; color:var(--encre);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:16px;
  }
  .feuille{
    max-width:820px; margin:0 auto; background:#FFF; padding:38px 42px 46px;
    box-shadow:0 2px 18px rgba(0,0,0,.07); border-radius:4px;
  }

  .barre{
    max-width:820px; margin:0 auto 14px; display:flex; gap:10px; flex-wrap:wrap;
    justify-content:flex-end;
  }
  .barre button, .barre a{
    padding:10px 16px; border-radius:9px; border:1.5px solid var(--trait);
    background:#FFF; color:var(--encre); font-size:13px; font-weight:800;
    font-family:inherit; cursor:pointer; text-decoration:none;
  }
  .barre .prim{ background:#228B5B; border-color:#228B5B; color:#FFF; }

  header.tete{ display:flex; justify-content:space-between; gap:28px; flex-wrap:wrap;
    border-bottom:2.5px solid var(--artisan); padding-bottom:18px; margin-bottom:22px; }
  .ent-entete{ display:flex; gap:12px; align-items:flex-start; }
  .ent-logo{ width:44px; height:44px; border-radius:10px; flex:none;
    background-size:cover; background-position:center; }
  .ent-nom{ font-size:19px; font-weight:900; color:var(--artisan); margin-bottom:5px; }
  .ent-ligne{ font-size:12px; color:var(--gris); line-height:1.55; }
  .doc-type{ text-align:right; }
  .doc-type .t{ font-size:26px; font-weight:900; letter-spacing:-.5px; }
  .doc-type .n{ font-size:13.5px; color:var(--gris); font-weight:700; margin-top:2px; }

  .paves{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:22px; }
  @media(max-width:620px){ .paves{ grid-template-columns:1fr; } }
  .pave{ border:1px solid var(--trait); border-radius:8px; padding:12px 14px; }
  .pave h2{ font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--vert); margin-bottom:7px; font-weight:800; }
  .pave .l{ font-size:12.5px; line-height:1.55; }

  h3.sec{ font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--artisan);
    font-weight:800; margin:24px 0 9px; padding-bottom:5px; border-bottom:1px solid var(--trait); }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--gris); font-weight:800; padding:7px 8px; border-bottom:1.5px solid var(--trait); }
  td{ padding:8px; border-bottom:1px solid var(--trait-clair); vertical-align:top; line-height:1.45; }
  td.n, th.n{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  tr.lot td{ background:var(--vert-clair); font-weight:800; font-size:11.5px;
    color:var(--artisan); text-transform:uppercase; letter-spacing:.05em; padding:7px 8px; }

  .totaux{ margin-top:16px; margin-left:auto; width:min(340px,100%); font-size:13px; }
  .totaux div{ display:flex; justify-content:space-between; padding:6px 0;
    border-bottom:1px solid var(--trait-clair); }
  .totaux .ttc{ border-bottom:none; border-top:2px solid var(--artisan); margin-top:4px;
    padding-top:9px; font-size:16px; font-weight:900; color:var(--artisan); }
  .totaux .num{ font-variant-numeric:tabular-nums; }

  .mentions{ margin-top:26px; display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:11.5px;
    color:var(--gris); line-height:1.55; }
  @media(max-width:620px){ .mentions{ grid-template-columns:1fr; } }
  .mentions b{ color:var(--encre); }

  /* Chaque mention etait un empilement : titre, retour a la ligne, texte —
     et deux <br> entre chacune. Sur un document A4, ca donnait une colonne de
     lignes courtes hachees, plus proche d'une liste de courses que d'un devis.
     Le libelle passe en tete de ligne, en petites capitales discretes, et le
     texte coule a la suite. Les <br><br> sont remplaces par un vrai espacement.
     Signale par Moctar le 01/09/2026 : « beaucoup de phrases ou l'unite est la
     ligne, c'est pas trop esthetique ». */
  .mentions .m-bloc{ margin-bottom:11px; }
  .mentions .m-bloc:last-child{ margin-bottom:0; }
  .mentions .m-k{ display:block; font-size:9.5px; font-weight:800; letter-spacing:.055em;
    text-transform:uppercase; color:var(--vert); margin-bottom:2px; }
  .mentions .m-v{ display:block; }
  /* Une signature manuscrite se lit a sa taille, pas etiree sur la largeur. */
  .trace-signature{ display:block; margin-top:9px; max-width:210px; width:60%;
    height:auto; mix-blend-mode:multiply; }

  /* 04/09/2026 — signature de l'artisan (pro_profiles.signature_image), a
     cote de la signature du client. `flex-wrap` fait qu'elles s'empilent
     d'elles-memes sous 620px (meme logique que .mentions un peu plus haut),
     sans media query dediee. */
  .signatures-wrap{ display:flex; gap:14px; margin-top:26px; flex-wrap:wrap; }
  .signatures-wrap .signature{ flex:1; min-width:220px; margin-top:0; }

  .signature{ margin-top:26px; border:1.5px solid var(--vert); border-radius:9px;
    padding:16px 18px; background:var(--vert-clair); }
  .signature .t{ font-size:13px; font-weight:900; color:var(--vert); margin-bottom:7px; }
  .signature .m{ font-size:12px; line-height:1.55; }
  .cadre-sign{ margin-top:12px; border:1px dashed #9FBFAE; border-radius:7px; height:92px;
    display:flex; align-items:flex-start; padding:9px 11px; font-size:11px; color:var(--gris); }

  .avert{ background:var(--alerte-fond); border:1px solid #E7B3A8; color:var(--alerte);
    border-radius:8px; padding:11px 13px; font-size:12px; line-height:1.5; margin-bottom:18px; }

  .pied{ margin-top:24px; padding-top:12px; border-top:1px solid var(--trait);
    font-size:10.5px; color:var(--gris); line-height:1.55; text-align:center; }

  #etat{ max-width:820px; margin:0 auto; padding:26px; background:#FFF; border-radius:8px;
    text-align:center; color:var(--gris); font-size:14px; }


  /* ── Mobile (02/09/2026) ──────────────────────────────────────────
     Mesure avant correction : dans une fenetre de 360 px, la page
     s'etendait sur 447 px. Deux causes cumulees — le padding de la
     feuille mangeait 84 px, et le tableau des prestations imposait sa
     largeur minimale. Un client qui ouvre son devis sur son telephone
     devait donc pousser la page de cote pour lire les montants.

     Trois corrections : padding reduit, echelle typographique resserree,
     et le tableau place dans un conteneur qui defile TOUT SEUL — la page,
     elle, ne bouge plus jamais lateralement. Rien de tout cela ne touche
     l'impression : le bloc @media print garde ses valeurs d'origine. */
  @media (max-width: 640px) {
    body { padding: 8px; }
    .feuille { padding: 22px 16px 28px; border-radius: 8px; }
    header.tete { gap: 14px; padding-bottom: 14px; margin-bottom: 16px; }
    .ent-nom { font-size: 17px; }
    .doc-type { text-align: left; }
    .doc-type .t { font-size: 22px; }
    .paves { gap: 10px; margin-bottom: 16px; }
    /* Le tableau defile dans sa propre boite. `-webkit-overflow-scrolling`
       garde l'inertie sur iOS, sinon le geste parait bloque. */
    .table-defile { overflow-x: auto; -webkit-overflow-scrolling: touch;
                    margin: 0 -4px; padding: 0 4px; }
    table { font-size: 11.5px; min-width: 300px; }
    th, td { padding: 6px 5px; }
    .totaux { width: 100%; font-size: 12.5px; }
    .mentions { gap: 12px; margin-top: 20px; }
    .signature { padding: 13px 14px; }
    .barre { justify-content: stretch; }
    .barre button, .barre a { flex: 1; text-align: center; padding: 12px 10px; }
  }

  @media print{
    body{ background:#FFF; padding:0; }
    .barre{ display:none; }
    .feuille{ box-shadow:none; max-width:none; padding:0; }
    tr, .signature, .pave{ break-inside:avoid; }
    /* Sans ca, Chrome et Firefox omettent par defaut les couleurs de fond a
       l'impression (economie d'encre) — le bandeau du tableau et le total
       ressortiraient en noir sur blanc, aux couleurs de personne. */
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div class="barre">
  <a id="retour" href="#">← Suivi du chantier</a>
  <button type="button" onclick="window.print()" class="prim">Télécharger en PDF</button>
</div>

<script src="./js/config.js"></script>

<div id="etat">Chargement de votre devis…</div>
<div class="feuille" id="feuille" hidden></div>

<script type="module">
  import { pub_getChantier, pub_getDevis, pub_getDocuments, fmtEuro } from './js/supabase.js';

  const params = new URLSearchParams(location.search);
  const token  = params.get('t');
  const devisId = params.get('id');
  const etat = document.getElementById('etat');
  const feuille = document.getElementById('feuille');
  document.getElementById('retour').href = './suivi.html?t=' + encodeURIComponent(token || '');

  // L'apostrophe est echappee elle aussi : sans elle, un futur attribut ecrit
  // en alt='...' serait vulnerable. Le cout est nul, l'oubli couteux.
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dateFr = (d) => d ? new Date(d).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }) : '—';

  // L'entreprise emettrice, par le meme token que le reste de la page de suivi.
  async function chargerEntreprise() {
    const cfg = window.__BATISPOT_CONFIG__ || {};
    const r = await fetch(`${cfg.SUPABASE_URL}/rest/v1/rpc/get_entreprise_by_token`, {
      method: 'POST',
      headers: { 'apikey': cfg.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token }),
    });
    if (!r.ok) return null;
    const d = await r.json();
    return Array.isArray(d) ? d[0] : d;
  }

  // Logo signe (bucket prive `chantiers`, meme Edge Function que suivi.html —
  // ce visiteur n'a pas de session pour signer l'URL lui-meme) ou, a defaut,
  // initiales sur un carre degrade. Meme convention que suivi.html (04/09/2026).
  function afficherLogoOuInitiales(nomEntreprise, logoUrl) {
    const box = document.getElementById('entLogoBox');
    if (!box) return;
    box.replaceChildren();
    if (logoUrl) {
      box.style.background = '';
      box.style.backgroundImage = `url("${logoUrl}")`;
      box.style.backgroundSize = 'cover';
      box.style.backgroundPosition = 'center';
    } else {
      box.style.background = 'linear-gradient(135deg,var(--artisan),#4CAF82)';
      box.style.backgroundImage = 'none';
      box.style.display = 'flex';
      box.style.alignItems = 'center';
      box.style.justifyContent = 'center';
      box.style.color = '#fff';
      box.style.fontWeight = '800';
      box.style.fontSize = '14px';
      const initiales = (nomEntreprise || '').split(/\s+/).filter(Boolean).slice(0, 2)
        .map((m) => m[0].toUpperCase()).join('');
      box.textContent = initiales || 'B';
    }
  }

  (async () => {
    if (!token) { etat.textContent = 'Lien invalide.'; return; }
    let chantier, devis, ent, docReponse;
    try {
      [chantier, devis, ent, docReponse] = await Promise.all([
        pub_getChantier(token), pub_getDevis(token), chargerEntreprise(),
        pub_getDocuments(token).catch(() => ({ documents: [], logo_url: null })),
      ]);
    } catch (_) {
      etat.textContent = "Ce devis n'est pas accessible. Le lien a peut-être expiré.";
      return;
    }

    // Couleur de l'artisan (repli vert BatiSpot). Validee ici : une valeur
    // hors format n'est jamais posee telle quelle sur une custom property.
    const couleurValide = ent?.couleur && /^#[0-9a-fA-F]{6}$/.test(ent.couleur) ? ent.couleur : '#228B5B';
    document.documentElement.style.setProperty('--artisan', couleurValide);
    const d = devisId ? (devis || []).find((x) => x.id === devisId) : (devis || [])[0];
    if (!d) {
      // ⚠️ Ce message unique couvrait TROIS situations tres differentes
      // (constate le 02/09/2026) : un lien invalide ou expire, un devis encore
      // en BROUILLON — donc invisible pour `get_devis_by_token`, qui ne sert
      // que envoye/accepte/refuse/expire — et un chantier reellement sans devis.
      // Or tout devis nouvellement cree part en brouillon : l'artisan qui
      // cliquait « Voir le devis signe » sur son propre devis lisait qu'il
      // n'existait pas.
      if (!chantier) {
        etat.textContent = "Ce lien n'est plus valide. Demandez-en un nouveau à votre artisan.";
      } else if (devisId) {
        etat.textContent = "Ce devis n'est pas encore consultable : il est en brouillon. "
          + "Votre artisan doit l'envoyer pour qu'il devienne un document officiel.";
      } else {
        etat.textContent = "Aucun devis n'est encore rattaché à ce chantier.";
      }
      return;
    }

    // On ne fabrique JAMAIS une mention absente. Si l'entreprise n'a pas renseigne son
    // SIRET ou sa decennale, le document le dit — un devis incomplet expose l'artisan
    // a une amende, mieux vaut qu'il le voie que de lui donner l'illusion du contraire.
    const manquantes = [];
    if (!ent) manquantes.push("les informations de l'entreprise");
    else {
      if (!ent.siret) manquantes.push('le numéro SIRET');
      if (!ent.address) manquantes.push("l'adresse de l'entreprise");
      if (!ent.assurance_nom || !ent.assurance_police) manquantes.push("l'assurance décennale");
      if (!ent.mediateur_nom) manquantes.push('le médiateur de la consommation');
    }

    const lignes = Array.isArray(d.lines) ? d.lines : [];
    const parLot = new Map();
    for (const l of lignes) {
      const lot = l.lot || 'Prestations';
      if (!parLot.has(lot)) parLot.set(lot, []);
      parLot.get(lot).push(l);
    }
    let corps = '';
    for (const [lot, items] of parLot) {
      corps += `<tr class="lot"><td colspan="4">${esc(lot)}</td></tr>`;
      for (const l of items) {
        const q = Number(l.quantity || 0), pu = Number(l.unitPrice || 0);
        corps += `<tr>
          <td>${esc(l.description || 'Prestation')}</td>
          <td class="n">${q ? q.toLocaleString('fr-FR') + ' ' + esc(l.unit || '') : '—'}</td>
          <td class="n">${pu ? fmtEuro(pu) : '—'}</td>
          <td class="n">${fmtEuro(Number(l.total_ht || q * pu))}</td>
        </tr>`;
      }
    }

    const tva = d.total_tva && d.total_ht ? Math.round((d.total_tva / d.total_ht) * 100) : null;
    const validite = d.validite_jours || 30;
    let expire = null;
    if (d.sent_at) { const e = new Date(d.sent_at); e.setDate(e.getDate() + validite); expire = e; }

    feuille.innerHTML = `
      ${manquantes.length ? `<div class="avert"><b>Ce devis est incomplet.</b> Il manque ${esc(manquantes.join(', '))}.
        Ces mentions sont obligatoires sur un devis de travaux (arrêté du 24 janvier 2017).
        Complétez le profil de l'entreprise avant de l'envoyer à un client.</div>` : ''}

      <header class="tete">
        <div class="ent-entete">
          <div class="ent-logo" id="entLogoBox" aria-hidden="true"></div>
          <div>
            <div class="ent-nom">${esc(ent?.display_name || 'Entreprise')}</div>
            <div class="ent-ligne">
              ${ent?.forme_juridique ? esc(ent.forme_juridique) + '<br>' : ''}
              ${ent?.address ? esc(ent.address) + '<br>' : ''}
              ${ent?.phone ? 'Tél. ' + esc(ent.phone) + '<br>' : ''}
              ${ent?.siret ? 'SIRET ' + esc(ent.siret) + '<br>' : ''}
              ${ent?.rcs ? esc(ent.rcs) + '<br>' : ''}
              ${ent?.tva_intracom ? 'TVA ' + esc(ent.tva_intracom) : ''}
            </div>
          </div>
        </div>
        <div class="doc-type">
          <div class="t">DEVIS</div>
          <div class="n">${esc(d.numero || '')}</div>
          <div class="ent-ligne" style="margin-top:8px;text-align:right;">
            Établi le ${dateFr(d.sent_at || chantier?.created_at)}<br>
            Valable ${validite} jours${expire ? `, jusqu'au ${dateFr(expire)}` : ''}
          </div>
        </div>
      </header>

      <div class="paves">
        <div class="pave">
          <h2>Client</h2>
          <div class="l">
            <b>${esc(chantier?.client_name || '—')}</b>
            ${chantier?.client_email ? '<br>' + esc(chantier.client_email) : ''}
          </div>
        </div>
        <div class="pave">
          <h2>Lieu d'exécution des travaux</h2>
          <div class="l">${esc(chantier?.adresse || 'Adresse à préciser')}</div>
        </div>
      </div>

      ${d.objet || chantier?.description ? `<h3 class="sec">Nature des travaux</h3>
        <div style="font-size:12.5px;line-height:1.6;">${esc(d.objet || chantier.description)}</div>` : ''}

      <h3 class="sec">Détail des prestations</h3>
      <div class="table-defile"><table>
        <thead><tr>
          <th>Désignation</th><th class="n">Quantité</th><th class="n">Prix unitaire HT</th><th class="n">Total HT</th>
        </tr></thead>
        <tbody>${corps}</tbody>
      </table></div>

      <div class="totaux">
        <div><span>Total HT</span><span class="num">${fmtEuro(d.total_ht || 0)}</span></div>
        <div><span>TVA${tva !== null ? ` (${tva} %)` : ''}</span><span class="num">${fmtEuro(d.total_tva || 0)}</span></div>
        <div class="ttc"><span>Total TTC</span><span class="num">${fmtEuro(d.total_ttc || 0)}</span></div>
      </div>

      <h3 class="sec">Conditions</h3>
      <div class="mentions">
        <div>
          <div class="m-bloc"><span class="m-k">Main-d’œuvre</span><span class="m-v">${ent?.taux_horaire_ttc ? fmtEuro(ent.taux_horaire_ttc) + ' TTC de l’heure. ' : ''}Le temps est décompté à l’heure entamée.</span></div>
          <div class="m-bloc"><span class="m-k">Frais de déplacement</span><span class="m-v">${esc(ent?.frais_deplacement || 'Aucun frais de déplacement.')}</span></div>
          <div class="m-bloc"><span class="m-k">Devis gratuit</span><span class="m-v">Le présent devis est gratuit et n’engage à rien tant qu’il n’est pas signé.</span></div>
        </div>
        <div>
          <div class="m-bloc"><span class="m-k">Règlement</span><span class="m-v">${esc(d.conditions_paiement || ent?.conditions_paiement || 'Selon accord entre les parties.')}</span></div>
          ${ent?.assurance_nom ? `<div class="m-bloc"><span class="m-k">Assurance décennale</span><span class="m-v">${esc(ent.assurance_nom)}${ent.assurance_police ? ' — police n° ' + esc(ent.assurance_police) : ''}${ent.assurance_couverture ? '. Couverture : ' + esc(ent.assurance_couverture) : ''}</span></div>` : ''}
          ${ent?.mediateur_nom ? `<div class="m-bloc"><span class="m-k">Médiateur de la consommation</span><span class="m-v">${esc(ent.mediateur_nom)}${ent.mediateur_coordonnees ? ' — ' + esc(ent.mediateur_coordonnees) : ''}</span></div>` : ''}
        </div>
      </div>

      <div class="signatures-wrap">
      ${/* Signature de l'artisan (pro_profiles.signature_image, exposee par
           get_entreprise_by_token) — meme regle de validation que celle du
           client juste en dessous : motif ancre aux deux bouts, sinon repli
           silencieux (rien ne s'affiche plutot qu'une image cassee ou un
           risque d'attribut injecte). */''}
      ${ent?.signature_image && /^data:image\/png;base64,[A-Za-z0-9+/]+={0,2}$/.test(ent.signature_image)
        ? `<div class="signature">
             <div class="t">Artisan</div>
             <img class="trace-signature" src="${esc(ent.signature_image)}"
                  alt="Signature de ${esc(ent.display_name || "l'entreprise")}">
             <div class="m" style="margin-top:8px;">Signé par ${esc(ent.display_name || "l'entreprise")}</div>
           </div>`
        : ''}
      <div class="signature">
        <div class="t">${d.status === 'accepte' ? 'Devis accepté' : 'Acceptation du devis'}</div>
        ${d.status === 'accepte'
          ? `<div class="m">Accepté${d.accepte_par ? ' par <b>' + esc(d.accepte_par) + '</b>' : ''}
             le ${dateFr(d.accepted_at)}, depuis l'espace de suivi de chantier.
             ${d.retractation_fin ? `Droit de rétractation ouvert jusqu’au ${dateFr(d.retractation_fin)}.` : ''}</div>
             ${/* Le trace manuscrit, sur le document conserve par les deux
                  parties. Un devis « signe » telecharge SANS sa signature ne
                  prouve rien — or c'est precisement la piece qu'on ressort en
                  cas de contestation. Le src est une data-URI deja en base :
                  aucune requete reseau, l'impression fonctionne hors ligne. */''}
             ${/* ⚠️ FAILLE CORRIGEE LE 02/09/2026.
                  Le motif etait ancre au DEBUT seulement : `/^data:image\/png;base64,/`.
                  Une valeur comme `data:image/png;base64,AAAA" onerror="..."` le
                  satisfait, sort de l'attribut src et execute du code dans la page
                  que le client ouvre. Un <img> injecte par innerHTML n'execute pas
                  un <script>, mais onerror SI — et un corps base64 invalide garantit
                  justement l'echec du chargement.
                  Les TROIS garde-fous ne validaient que le prefixe : cette page,
                  l'Edge Function signer-devis, et le CHECK en base. Aucun ne
                  regardait le contenu.
                  Desormais : motif ancre aux DEUX bouts avec le jeu de caracteres
                  base64 exact, ET echappement du src — la ceinture et les bretelles,
                  parce que c'est le document juridique du client. */''}
             ${d.signature_image && /^data:image\/png;base64,[A-Za-z0-9+/]+={0,2}$/.test(d.signature_image)
               ? `<img class="trace-signature" src="${esc(d.signature_image)}"
                       alt="Signature de ${esc(d.accepte_par || 'du client')}">`
               : ''}`
          : `<div class="m">Pour accepter, portez la mention manuscrite <b>« Bon pour travaux »</b>,
             datez et signez. Vous pouvez aussi accepter en un clic depuis votre espace de suivi.</div>
             <div class="cadre-sign">Date, mention « Bon pour travaux » et signature du client</div>`}
      </div>
      </div>

      <div class="pied">
        ${esc(ent?.footer_note || '')}
        <br>Si ce devis a été signé à votre domicile hors établissement, vous disposez d'un délai
        de rétractation de quatorze jours à compter de sa signature.
      </div>
    `;
    afficherLogoOuInitiales(ent?.display_name, docReponse?.logo_url);
    etat.hidden = true;
    feuille.hidden = false;
    document.title = `Devis ${d.numero || ''} · ${chantier?.client_name || ''}`;
  })();
</script>
</body>
</html>
