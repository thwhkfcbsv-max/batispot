    .index-cta-ghost {

  <script type="module">
    // Hero deja affiche : on charge supabase en async non-bloquant et redirige SI session.
    // Pas de loading screen — la page apparait immediatement pour les anon (cas le plus frequent).
    import('./js/supabase.js').then(async ({ getSession, resolveUserRole }) => {
      try {
        const session = await getSession();
        if (!session) return; // anon : on reste sur le hero
        const role = await resolveUserRole();
        window.location.replace(role === 'pro' ? './dashboard.html' : './client.html');
      } catch (err) {
        console.warn('[index] session check failed', err);
        // En cas d'erreur, on laisse le hero affiche (l'utilisateur peut cliquer Je suis client/artisan)
      }
    });
  </script>
  <script src="/js/update-detector.js" defer></script>
