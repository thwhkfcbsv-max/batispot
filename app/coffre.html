<script type="module">
import { requireAuth, toast, listCoffreDocs, uploadCoffreDoc, majVisibiliteDoc,
         coffreDocSignedUrl, deleteCoffreDoc, coffreDocsExpirants } from './js/supabase.js';

const session = await requireAuth('./login.html');
if (!session) throw new Error('No session');

const CATEGORIES = {
  kbis: 'Kbis', decennale: 'Décennale', rc_pro: 'RC Pro', urssaf: 'URSSAF',
  fiscale: 'Attestation fiscale', plan: 'Plans', pv_reception: 'PV de réception',
  garantie: 'Garanties', facture_fournisseur: 'Factures fournisseur', autre: 'Autres',
};
// Ces pièces ont une date de fin : c'est le cœur de l'intérêt du coffre-fort.
const AVEC_EXPIRATION = ['decennale', 'rc_pro', 'urssaf', 'fiscale'];

// Qui voit quoi. Par defaut « prive » : un document n'est jamais expose a
// l'equipe sans que le patron l'ait decide.
// « Client » (01/09/2026) est le seul cran qui sort de l'entreprise : le
// document devient lisible depuis le lien de suivi du chantier. C'est ce qui
// permet enfin de remettre l'attestation decennale, que la loi 2014-626 oblige
// a justifier — jusqu'ici aucune valeur ne le permettait, ni en base ni ici.
const VISIBILITE = {
  prive:  { libelle: 'Vous seul',        aide: 'Personne d\'autre ne le voit' },
  chefs:  { libelle: 'Chefs d\'equipe',  aide: 'Vous et vos chefs d\'equipe' },
  equipe: { libelle: 'Toute l\'equipe',  aide: 'Tous vos compagnons y ont acces' },
  client: { libelle: 'Vos clients',      aide: 'Visible par le client, depuis son lien de suivi' },
};

let docs = [];
let filtre = 'tous';
let recherche = '';

// Accents et casse ignores : un artisan qui tape « decennale » doit trouver
// « Attestation décennale ».
const sansAccent = (t) => String(t || '').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function poids(o) {
  if (!o) return '';
  return o > 1048576 ? `${(o / 1048576).toFixed(1)} Mo` : `${Math.round(o / 1024)} Ko`;
}

function etatExpiration(d) {
  if (!d.expire_le) return '';
  const jours = Math.ceil((new Date(d.expire_le) - new Date()) / 86400000);
  const date = new Date(d.expire_le).toLocaleDateString('fr-FR');
  // Pilule ambre des que l'echeance est a moins de 60 jours (deja expiree incluse).
  if (jours < 60) {
    const texte = jours < 0 ? `Expirée le ${date}` : `Expire le ${date}`;
    return `<span class="mq-pill mq-wait">${texte}</span>`;
  }
  return `<span style="font-size:11.5px;color:var(--muted);">Valide jusqu'au ${date}</span>`;
}

function rendre() {
  const zone = document.getElementById('liste');
  let vus = filtre === 'tous' ? docs : docs.filter((d) => d.categorie === filtre);
  if (recherche) {
    const q = sansAccent(recherche);
    // On cherche dans le nom ET dans le libelle de categorie : « assurance »
    // doit sortir la decennale meme si le fichier s'appelle « scan_042.pdf ».
    vus = vus.filter((d) => sansAccent(d.nom).includes(q)
      || sansAccent(CATEGORIES[d.categorie] || d.categorie).includes(q));
  }

  if (!docs.length) {
    zone.innerHTML = `<div class="doc-vide">Aucun document pour l'instant.<br>
      Ajoutez votre Kbis et votre attestation décennale : vous les aurez sur vous à chaque chantier.</div>`;
    return;
  }
  if (!vus.length) {
    zone.innerHTML = recherche
      ? `<div class="doc-vide">Aucun document ne correspond à « ${esc(recherche)} ».</div>`
      : `<div class="doc-vide">Aucun document dans cette catégorie.</div>`;
    return;
  }

  zone.innerHTML = vus.map((d) => `
    <div class="mq-card" style="flex-wrap:wrap;align-items:flex-start;">
      <div class="doc-ico">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
      </div>
      <div class="mq-t">
        ${esc(d.nom)}
        <small>${esc(CATEGORIES[d.categorie] || d.categorie)}${d.taille_octets ? ' · ' + poids(d.taille_octets) : ''}</small>
      </div>
      ${etatExpiration(d)}
      <div style="flex-basis:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;">
        <button type="button" data-vis="${esc(d.id)}" data-actuelle="${esc(d.visibilite || 'prive')}"
                style="background:none;border:none;padding:0;min-height:32px;font-size:11.5px;font-weight:700;color:var(--t1);cursor:pointer;text-decoration:underline;">
          ${esc((VISIBILITE[d.visibilite] || VISIBILITE.prive).libelle)}
        </button>
        <div style="display:flex;gap:6px;">
          <button type="button" class="mq-btn mq-ghost" style="min-height:40px;padding:0 12px;font-size:12px;"
                  data-ouvrir="${esc(d.chemin)}">Ouvrir</button>
          <button type="button" class="mq-btn mq-ghost" style="min-height:40px;padding:0 12px;font-size:12px;"
                  data-suppr="${esc(d.id)}" data-chemin="${esc(d.chemin)}">Supprimer</button>
        </div>
      </div>
    </div>`).join('');

  zone.querySelectorAll('[data-ouvrir]').forEach((b) => {
    b.onclick = async () => {
      try { window.open(await coffreDocSignedUrl(b.dataset.ouvrir), '_blank'); }
      catch { toast("Document introuvable. Il a peut-être été supprimé."); }
    };
  });
  zone.querySelectorAll('[data-vis]').forEach((b) => {
    b.onclick = async () => {
      const ordre = ['prive', 'chefs', 'equipe', 'client'];
      const liste = ordre.map((v, i) => `${i + 1}. ${VISIBILITE[v].libelle} — ${VISIBILITE[v].aide}`).join('\n');
      const rep = prompt(`Qui peut voir ce document ?\n${liste}\n\nTapez le numéro :`,
                         String(ordre.indexOf(b.dataset.actuelle) + 1));
      const i = parseInt(rep, 10) - 1;
      if (!(i >= 0 && i < ordre.length)) return;
      try {
        await majVisibiliteDoc(b.dataset.vis, ordre[i]);
        const d = docs.find((x) => x.id === b.dataset.vis);
        if (d) d.visibilite = ordre[i];
        rendre();
        toast(`Visible par : ${VISIBILITE[ordre[i]].libelle.toLowerCase()}.`);
      } catch {
        toast("Seul le patron peut changer qui voit un document.");
      }
    };
  });

  zone.querySelectorAll('[data-suppr]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Supprimer ce document ?')) return;
      try {
        await deleteCoffreDoc(b.dataset.suppr, b.dataset.chemin);
        docs = docs.filter((d) => d.id !== b.dataset.suppr);
        rendre(); filtres(); toast('Document supprimé.');
      } catch { toast("Suppression impossible. Seuls le patron et le chef d'équipe peuvent supprimer."); }
    };
  });
}

function filtres() {
  const presentes = [...new Set(docs.map((d) => d.categorie))];
  document.getElementById('filtres').innerHTML =
    [['tous', 'Tous'], ...presentes.map((c) => [c, CATEGORIES[c] || c])]
      .map(([v, l]) => `<button type="button" data-f="${v}" class="${v === filtre ? 'on' : ''}">${esc(l)}</button>`)
      .join('');
  document.querySelectorAll('#filtres button').forEach((b) => {
    b.onclick = () => { filtre = b.dataset.f; filtres(); rendre(); };
  });
}

async function alerter() {
  try {
    const proches = await coffreDocsExpirants(60);
    const zone = document.getElementById('alerteExpiration');
    if (!proches.length) { zone.style.display = 'none'; return; }
    zone.style.display = 'block';
    zone.textContent = proches.length === 1
      ? `${CATEGORIES[proches[0].categorie] || 'Un document'} expire le ${new Date(proches[0].expire_le).toLocaleDateString('fr-FR')}.`
      : `${proches.length} documents expirent dans les 60 jours.`;
  } catch { /* l'alerte ne doit jamais empêcher l'affichage de la liste */ }
}

document.getElementById('fichierDoc').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  e.target.value = '';

  const cats = Object.entries(CATEGORIES).map(([k, v], i) => `${i + 1}. ${v}`).join('\n');
  const rep = prompt(`Quel type de document ?\n${cats}\n\nTapez le numéro :`, '1');
  const idx = parseInt(rep, 10) - 1;
  const cles = Object.keys(CATEGORIES);
  if (!(idx >= 0 && idx < cles.length)) return;
  const categorie = cles[idx];

  let expire = null;
  if (AVEC_EXPIRATION.includes(categorie)) {
    const d = prompt("Date de fin de validité (JJ/MM/AAAA) — laissez vide si vous ne l'avez pas :", '');
    if (d && /^\d{2}\/\d{2}\/\d{4}$/.test(d.trim())) {
      const [j, m, a] = d.trim().split('/');
      expire = `${a}-${m}-${j}`;
    }
  }

  const ordreVis = ['prive', 'chefs', 'equipe', 'client'];
  const listeVis = ordreVis.map((v, i) => `${i + 1}. ${VISIBILITE[v].libelle} — ${VISIBILITE[v].aide}`).join('\n');
  const repVis = prompt(`Qui peut voir ce document ?\n${listeVis}\n\nTapez le numéro :`, '1');
  const iv = parseInt(repVis, 10) - 1;
  const visibilite = (iv >= 0 && iv < ordreVis.length) ? ordreVis[iv] : 'prive';

  toast('Envoi en cours…');
  try {
    const cree = await uploadCoffreDoc(f, { categorie, expire_le: expire, visibilite });
    docs.unshift(cree);
    filtres(); rendre(); alerter();
    toast('Document enregistré.');
  } catch (err) {
    toast(err && err.message ? err.message : "Envoi impossible. Vérifiez votre connexion.");
  }
});

// ⚠️ Le message d'erreur etait ECRIT puis EFFACE dans le meme tick : `rendre()`
// s'executait inconditionnellement juste apres et le remplacait par « Aucun
// document ». L'artisan concluait que son coffre etait vide alors que la
// requete avait echoue — et il redeposait ses attestations.
let chargementOk = true;
try {
  const champRecherche = document.getElementById('rechercheDoc');
if (champRecherche) {
  champRecherche.addEventListener('input', () => {
    recherche = champRecherche.value.trim();
    rendre();
  });
}

docs = await listCoffreDocs();
} catch {
  chargementOk = false;
  document.getElementById('liste').innerHTML =
    `<div class="doc-vide">Vos documents n'ont pas pu être chargés. Vérifiez votre connexion,
     puis rechargez la page.<br><small>Vos documents ne sont pas perdus.</small></div>`;
}
filtres();
if (chargementOk) rendre();
alerter();
</script>
