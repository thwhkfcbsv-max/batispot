<script src="./js/app-demo-assistant.js?v=2026_09_12c"></script>
  <script>
    // js/app-assistant.js insère par défaut sa propre carte « L'assistant
    // propose » générique (.ui-assist). Cet écran en construit une à la main
    // (fidèle au reste de l'app, cf. dashboard.html) avec les deux actions de
    // messagerie demandées par le fondateur — on ne veut donc pas des deux.
    // Un libellé vide fait filtrer la suggestion par bsSuggestionsPourPage()
    // (elle exige un s.label truthy) : la liste retombe à vide, sa carte ne
    // s'insère pas.
    window.bsSuggestions = [{ label: "" }];
  </script>
  <script type="module">
    import {
      supabase, requireAuth, listChantiers, TYPE_TRAVAUX_LABEL,
      // Création de groupe (07/09/2026) : créer un groupe = poster le premier
      // message du fil interne, c'est lui qui le fait exister partout.
      envoyerMessageEquipe, listMessagesEquipe, listTachesChantier, listMembres,
      listGroupesLibres, creerGroupeLibre, envoyerMessageGroupe,
    } from "./js/supabase.js";
    import { listContacts, apercuConversations } from "./js/messages-directs.js";
    import { actualiserBadgeMessages, initialesDe, heureRelative, apercuContenu } from "./js/mq-thread.js";
    import { telAppelable } from "./js/tel.js";

    // Un instant, jamais une chaîne. Les dates de cet écran viennent de sources
    // différentes (messages.created_at avec fuseau, chantiers.updated_at sans) :
    // comparées caractère par caractère avec localeCompare, elles se classaient
    // faux. Règle Moctar : on compare des epochs.
    //
    // ⚠️ 09/09/2026 — DÉCLARÉ ICI, AU NIVEAU DU MODULE, et plus dans une seule
    // fonction. Posé le 08/09 dans le rendu des clients, il était appelé depuis
    // `renderEquipe()` et `quandAvec()` qui ne le voyaient pas : « Liste non
    // chargée (instant is not defined) » sur l'appareil de Moctar. Un helper
    // utilisé par trois fonctions ne se déclare pas dans l'une d'elles.
    const instant = (d) => { const t = Date.parse(d || ""); return Number.isNaN(t) ? 0 : t; };

    // Mon identifiant : sert à ne pas compter mes propres messages d'équipe
    // comme « non lus ». Posé par initMessages() juste après requireAuth().
    let MON_ID = null;

    // ── Déduction de l'"objet" du chantier ─────────────────
    // Même logique que dashboard.html (objetChantier) : le type déclaré prime,
    // sinon on le devine dans la description. Dupliquée volontairement — ni
    // dashboard.html ni chantier.js n'exportent rien, ce sont des scripts de
    // page, pas des libs.
    const MOTS_TYPE = [
      [/cuisine/, "cuisine"],
      [/salle\s*de\s*bain|sdb|douche|baignoire/, "salle_bain"],
      [/électric|electric|tableau|prise/, "electricite"],
      [/toiture|toit|charpente|tuile/, "toiture"],
      [/plomb|fuite|robinet|évier|evier|chauffe-eau/, "plomberie"],
      [/peinture|peindre|enduit|revêtement|revetement/, "peinture"],
      [/façade|facade|ravalement|crépi|crepi/, "facade"],
    ];
    function objetChantier(c) {
      if (c.type_travaux && TYPE_TRAVAUX_LABEL[c.type_travaux]) return TYPE_TRAVAUX_LABEL[c.type_travaux];
      const txt = String(c.description || "").toLowerCase();
      for (const [re, cle] of MOTS_TYPE) if (re.test(txt)) return TYPE_TRAVAUX_LABEL[cle];
      return TYPE_TRAVAUX_LABEL.autre;
    }

    function tronquer(texte, n = 80) {
      const t = String(texte ?? "").replace(/\s+/g, " ").trim();
      return t.length > n ? t.slice(0, n).trimEnd() + "…" : t;
    }

    // Une rangée de la liste : avatar rond, nom, aperçu sur UNE ligne,
    // heure relative à droite, pastille verte des non-lus. 64px maximum —
    // on y lit qui attend une réponse, pas le message lui-même.
    // Tout est posé en textContent : un aperçu de message est du texte
    // écrit par quelqu'un d'autre, il ne devient jamais du HTML.
    function rangeeFil({ href, initiales, icone, nom, apercu, quand, nb = 0, inactif = false, tel = null }) {
      const r = document.createElement(href ? "a" : "div");
      r.className = "mq-row" + (nb > 0 ? " mq-nonlu" : "") + (inactif ? " mq-inactif" : "");
      if (href) r.href = href;
      // Répertoire client : appeler depuis la ligne (tel:), sans ouvrir le fil.
      if (tel) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "mq-row-tel"; b.setAttribute("aria-label", "Appeler");
        b.innerHTML = window.bsIcon ? window.bsIcon("phone", 16) : "";
        b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); location.href = "tel:" + tel; });
        r.appendChild(b);
      }

      const av = document.createElement("div");
      av.className = "mq-av";
      if (icone) av.innerHTML = window.bsIcon ? window.bsIcon(icone, 20) : "";
      else av.textContent = initiales;
      r.appendChild(av);

      const n = document.createElement("div");
      n.className = "mq-nom";
      n.textContent = nom;
      r.appendChild(n);

      const a = document.createElement("div");
      a.className = "mq-apercu";
      a.textContent = apercu;
      r.appendChild(a);

      const q = document.createElement("div");
      q.className = "mq-quand";
      q.textContent = quand || "";
      r.appendChild(q);

      if (nb > 0) {
        const b = document.createElement("div");
        b.className = "mq-nb";
        b.textContent = nb > 99 ? "99+" : String(nb);
        b.setAttribute("aria-label", `${nb} message${nb > 1 ? "s" : ""} non lu${nb > 1 ? "s" : ""}`);
        r.appendChild(b);
      }
      return r;
    }

    // Texte centré et discret — état vide.
    function noteCentree(texte) {
      const p = document.createElement("p");
      p.className = "mq-center";
      p.textContent = texte;
      return p;
    }

    // ── Chargement groupé : chantiers du pro + UNE requête messages (300
    // derniers, tous chantiers confondus, RLS pro_own_messages s'occupe déjà
    // de ne rendre que les siens) — jamais une requête par chantier. ────────
    async function chargerDonnees() {
      const tous = await listChantiers();

      let msgs = [];
      try {
        const { data, error } = await supabase
          .from("messages")
          // lu_le est lu ici pour compter les non-lus dans la pastille de
          // chaque rangée (tâche 24). Colonne ajoutée le 04/09 ; si elle
          // manquait, la requête entière échouerait — d'où le repli plus bas
          // sur une seconde requête sans elle, plutôt qu'un écran vide.
          .select("chantier_id, groupe_id, author, auteur_id, content, created_at, visible_client, lu_le")
          .order("created_at", { ascending: false })
          .limit(300);
        if (error) throw error;
        msgs = data || [];
      } catch (e) {
        console.warn("[messages] lu_le indisponible, liste sans pastilles", e);
        try {
          const { data } = await supabase
            .from("messages")
            .select("chantier_id, groupe_id, author, auteur_id, content, created_at, visible_client")
            .order("created_at", { ascending: false })
            .limit(300);
          msgs = data || [];
        } catch (e2) { console.warn("[messages] messages indisponibles", e2); }
      }

      // Dernier message CLIENT ⇄ ARTISAN (visible_client=true, pro/client)
      // par chantier — même filtre que listMessages() dans supabase.js, pour
      // ne jamais montrer au patron un message interne d'équipe comme s'il
      // venait d'un client. `msgs` est déjà trié created_at desc : le
      // premier rencontré par chantier est le plus récent.
      const dernierClientParChantier = new Map();
      const nonLusParChantier = new Map();
      // Dernier message INTERNE (visible_client=false, membre ou patron en
      // coulisses) PAR CHANTIER — un groupe d'équipe par chantier (Moctar,
      // 05/09), plus le total pour la rangée générique quand aucun groupe
      // n'a encore parlé.
      let derniereInterne = null;
      let nonLusEquipe = 0;
      const derniereInterneParChantier = new Map();
      const nonLusInterneParChantier = new Map();
      // Groupes LIBRES (12/09) : messages sans chantier, portés par groupe_id.
      const derniereInterneParGroupe = new Map();
      const nonLusParGroupe = new Map();
      let libres = [];
      try { libres = await listGroupesLibres(); } catch (e) { console.warn("[messages] groupes libres indisponibles", e); }
      for (const m of msgs) {
        if (m.visible_client === true && (m.author === "pro" || m.author === "client")) {
          if (!dernierClientParChantier.has(m.chantier_id)) {
            dernierClientParChantier.set(m.chantier_id, m);
          }
          // Non lu = message du CLIENT que l'artisan n'a pas encore ouvert.
          if (m.author === "client" && !m.lu_le) {
            nonLusParChantier.set(m.chantier_id, (nonLusParChantier.get(m.chantier_id) || 0) + 1);
          }
        } else if (m.visible_client === false) {
          if (!derniereInterne) derniereInterne = m;
          if (m.groupe_id) {
            if (!derniereInterneParGroupe.has(m.groupe_id)) derniereInterneParGroupe.set(m.groupe_id, m);
            if (!m.lu_le && m.auteur_id !== MON_ID) {
              nonLusEquipe += 1;
              nonLusParGroupe.set(m.groupe_id, (nonLusParGroupe.get(m.groupe_id) || 0) + 1);
            }
            continue;
          }
          if (!derniereInterneParChantier.has(m.chantier_id)) derniereInterneParChantier.set(m.chantier_id, m);
          if (!m.lu_le && m.auteur_id !== MON_ID) {
            nonLusEquipe += 1;
            nonLusInterneParChantier.set(m.chantier_id, (nonLusInterneParChantier.get(m.chantier_id) || 0) + 1);
          }
        }
      }

      return { tous, dernierClientParChantier, nonLusParChantier, derniereInterne, nonLusEquipe, derniereInterneParChantier, nonLusInterneParChantier, libres, derniereInterneParGroupe, nonLusParGroupe };
    }

    function renderClients(tous, dernierClientParChantier, nonLusParChantier) {
      const area = document.getElementById("clients-area");
      area.replaceChildren();

      // Répertoire : un client par chantier, tous les chantiers (les terminés
      // en dernier) — c'est un carnet, pas seulement une boîte de réception.
      const items = tous.slice();

      if (!items.length) {
        area.appendChild(noteCentree(
          "Aucun client pour l'instant. Créez un chantier : votre client vous écrit depuis sa page de suivi.",
        ));
        return;
      }

      // Tri : à répondre (dernier message du client) d'abord, puis par date
      // du dernier message (les chantiers sans aucun message encore, mais
      // en cours, retombent en fin de liste via leur date de mise à jour).
      items.sort((a, b) => {
        const ma = dernierClientParChantier.get(a.id);
        const mb = dernierClientParChantier.get(b.id);
        // Le dernier message remonte (Moctar, 05/09), reçu ou envoyé ;
        // les chantiers sans message restent derrière, terminés en dernier.
        const aDesMsgA = ma ? 1 : 0, aDesMsgB = mb ? 1 : 0;
        if (aDesMsgA !== aDesMsgB) return aDesMsgB - aDesMsgA;
        const finiA = a.status === "termine" ? 1 : 0;
        const finiB = b.status === "termine" ? 1 : 0;
        if (finiA !== finiB) return finiA - finiB;
        const dateA = instant((ma && ma.created_at) || a.updated_at || a.created_at);
        const dateB = instant((mb && mb.created_at) || b.updated_at || b.created_at);
        return dateB - dateA;
      });

      items.forEach((c) => {
        const dernier = dernierClientParChantier.get(c.id);
        area.appendChild(rangeeFil({
          href: `./chantier.html?id=${c.id}#messages`,
          initiales: initialesDe(c.client_name),
          nom: `${c.client_name || "Client"} · ${objetChantier(c)}`,
          // L'aperçu dit QUI a parlé en dernier : sans ça, l'artisan relit son
          // propre message en croyant que son client a répondu.
          apercu: dernier
            ? (dernier.author === "pro" ? "Vous : " : "") + tronquer(dernier.content)
            : "Aucun message pour l'instant.",
          quand: dernier ? heureRelative(dernier.created_at) : "",
          nb: nonLusParChantier.get(c.id) || 0,
          // (05/09, Moctar) pas de bouton Appeler ici : il est déjà sur la
          // fiche du chantier qu'ouvre la ligne.
        }));
      });
    }

    // ── Créer un groupe de chantier (07/09/2026) ────────────────────────────
    // Moctar : « je devrais facilement pouvoir créer un groupe, je ne sais pas
    // où ». Il n'y avait effectivement aucun geste de création : un groupe
    // n'apparaissait qu'APRÈS qu'on ait écrit dedans, ce qui suppose de savoir
    // qu'il existe. On ajoute le geste qui manquait, sans rien changer au
    // modèle : créer un groupe = poster son premier message.
    async function ouvrirNouveauGroupe(chantiers) {
      const ouverts = (chantiers || []).filter((c) => c.status !== "termine");
      // (12/09) Un groupe libre se crée même sans chantier : plus de blocage ici.
      const fond = document.createElement("div");
      fond.style.cssText = "position:fixed;inset:0;background:rgba(15,81,50,.45);z-index:1200;"
        + "display:flex;align-items:flex-end;justify-content:center;";
      const feuille = document.createElement("div");
      feuille.style.cssText = "background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;"
        + "padding:18px 16px 24px;max-height:80vh;overflow:auto;";
      feuille.innerHTML = '<div style="font-weight:800;font-size:17px;margin-bottom:4px;">Nouveau groupe</div>'
        + '<div style="color:#5A7268;font-size:13.5px;margin-bottom:14px;">'
        + (ouverts.length ? 'Un groupe libre (vous choisissez le nom et les membres), ou le groupe d\'un chantier.' : 'Un groupe libre : vous choisissez le nom et les membres.') + '</div>';
      const liste = document.createElement("div");
      liste.style.cssText = "display:flex;flex-direction:column;gap:8px;";
      const libre = document.createElement("button");
      libre.type = "button"; libre.className = "mq-btn mq-ghost";
      libre.style.cssText = "justify-content:flex-start;text-align:left;min-height:52px;font-size:15px;font-weight:700;border-style:dashed;";
      libre.textContent = "+ Groupe libre (sans chantier)";
      libre.addEventListener("click", () => ouvrirNouveauGroupeLibre(feuille, fond));
      liste.appendChild(libre);
      ouverts.forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "mq-btn mq-ghost";
        b.style.cssText = "justify-content:flex-start;text-align:left;min-height:52px;font-size:15px;";
        b.textContent = c.client_name || "Chantier";
        b.addEventListener("click", () => creerGroupe(c, fond));
        liste.appendChild(b);
      });
      feuille.appendChild(liste);
      const annuler = document.createElement("button");
      annuler.type = "button";
      annuler.className = "mq-btn mq-ghost";
      annuler.style.cssText = "width:100%;margin-top:14px;min-height:44px;";
      annuler.textContent = "Annuler";
      annuler.addEventListener("click", () => fond.remove());
      feuille.appendChild(annuler);
      fond.appendChild(feuille);
      fond.addEventListener("click", (e) => { if (e.target === fond) fond.remove(); });
      document.body.appendChild(fond);
    }

        // Groupe LIBRE (12/09, Moctar : « je dois pouvoir créer des groupes sans
    // lien avec le chantier ») : un nom, des membres cochés, et le fil s'ouvre.
    async function ouvrirNouveauGroupeLibre(feuille, fond) {
      feuille.replaceChildren();
      feuille.insertAdjacentHTML("beforeend", '<div style="font-weight:800;font-size:17px;margin-bottom:4px;">Nouveau groupe libre</div>'
        + '<div style="color:#5A7268;font-size:13.5px;margin-bottom:12px;">Un nom, puis qui en fait partie. Tout le monde peut lire les fils d\'équipe ; cocher quelqu\'un l\'annonce dans le groupe et le prévient.</div>');
      const nom = document.createElement("input");
      nom.type = "text"; nom.placeholder = "Nom du groupe (ex. Équipe peinture)"; nom.maxLength = 80; nom.autocomplete = "off";
      nom.style.cssText = "width:100%;min-height:48px;font-size:16px;padding:10px 12px;border:1px solid #D3E3DA;border-radius:10px;margin-bottom:12px;";
      feuille.appendChild(nom);
      const zone = document.createElement("div");
      zone.style.cssText = "display:flex;flex-direction:column;gap:8px;margin-bottom:14px;";
      feuille.appendChild(zone);
      let membres = [];
      try { membres = (await listMembres()) || []; } catch (_) {}
      membres = membres.filter((m) => m && m.statut === "actif" && m.user_id !== MON_ID);
      if (!membres.length) {
        zone.insertAdjacentHTML("beforeend", '<div style="color:#5A7268;font-size:13.5px;">Aucun coéquipier actif pour l\'instant : le groupe sera créé avec vous seul, vous pourrez y écrire dès maintenant.</div>');
      }
      membres.forEach((m) => {
        const lab = document.createElement("label");
        lab.style.cssText = "display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;";
        const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = m.id; cb.dataset.prenom = m.prenom || ""; cb.style.cssText = "width:20px;height:20px;accent-color:#228B5B;";
        lab.append(cb, document.createTextNode((m.prenom || "") + (m.nom ? " " + m.nom : "") + (m.metier ? " · " + m.metier : "")));
        zone.appendChild(lab);
      });
      const creer = document.createElement("button");
      creer.type = "button"; creer.className = "mq-btn"; creer.style.cssText = "width:100%;min-height:48px;";
      creer.textContent = "Créer le groupe";
      creer.addEventListener("click", async () => {
        const n = nom.value.trim();
        if (!n) { nom.focus(); return; }
        creer.disabled = true; creer.textContent = "Création…";
        const coches = Array.from(zone.querySelectorAll("input:checked"));
        try {
          const g = await creerGroupeLibre(n, coches.map((c) => c.value));
          const prenoms = coches.map((c) => c.dataset.prenom).filter(Boolean);
          await envoyerMessageGroupe(g.id, `Groupe « ${n} » créé.` + (prenoms.length ? ` Participants : ${prenoms.join(", ")}.` : ""));
          location.href = `./equipe.html?groupe=${g.id}#fil`;
        } catch (e) {
          console.warn("[groupe libre] création impossible", e);
          creer.disabled = false; creer.textContent = "Créer le groupe";
          alert("Le groupe n'a pas pu être créé. Réessayez.");
        }
      });
      feuille.appendChild(creer);
      const annuler = document.createElement("button");
      annuler.type = "button"; annuler.className = "mq-btn mq-ghost"; annuler.style.cssText = "width:100%;margin-top:10px;min-height:44px;";
      annuler.textContent = "Annuler"; annuler.addEventListener("click", () => fond.remove());
      feuille.appendChild(annuler);
      setTimeout(() => nom.focus(), 50);
    }

    async function creerGroupe(chantier, fond) {
      try {
        // Le groupe existe peut-être déjà : on l'ouvre au lieu d'en empiler un
        // second, qui n'aurait aucun sens (un chantier = un fil).
        const deja = await listMessagesEquipe(chantier.id).catch(() => []);
        if (deja && deja.length) {
          location.href = `./equipe.html?chantier=${chantier.id}#fil`;
          return;
        }
        const [taches, membres] = await Promise.all([
          listTachesChantier(chantier.id).catch(() => []),
          listMembres().catch(() => []),
        ]);
        const assignes = new Set((taches || []).map((t) => t.assigne_id).filter(Boolean));
        const prenoms = (membres || [])
          .filter((m) => assignes.has(m.id) || assignes.has(m.user_id))
          .map((m) => m.prenom).filter(Boolean);
        await envoyerMessageEquipe(chantier.id,
          `Groupe du chantier ${chantier.client_name || "sans nom"} créé.`
          + (prenoms.length ? ` Participants : ${prenoms.join(", ")}.` : ""));
        location.href = `./equipe.html?chantier=${chantier.id}#fil`;
      } catch (e) {
        console.warn("[groupe] création impossible", e);
        if (fond) fond.remove();
        alert("Le groupe n'a pas pu être créé. Réessayez.");
      }
    }

    function renderEquipe(derniereInterne, nonLusEquipe, tous = [], derniereInterneParChantier = new Map(), nonLusInterneParChantier = new Map(), libres = [], derniereInterneParGroupe = new Map(), nonLusParGroupe = new Map()) {
      // L'icone sous les onglets ouvre la meme feuille que la rangee : elle a
      // besoin de la liste des chantiers, qui n'est connue qu'ici.
      const ico = document.getElementById("btnGroupeIcone");
      if (ico) { ico.onclick = () => ouvrirNouveauGroupe(tous); }
      const area = document.getElementById("equipe-area");
      area.replaceChildren();
      // Un groupe par chantier qui a déjà parlé, le plus récent d'abord ;
      // chaque rangée ouvre directement ce groupe dans equipe.html.
      const parId = new Map(tous.map((c) => [c.id, c]));
      const groupes = Array.from(derniereInterneParChantier.entries())
        .filter(([id]) => parId.has(id))
        .sort((a, b) => instant(b[1].created_at) - instant(a[1].created_at));
      // Groupes LIBRES d'abord (12/09) : ceux que l'artisan a nommés lui-même.
      libres.slice().sort((a, b) => {
        const da = derniereInterneParGroupe.get(a.id), db = derniereInterneParGroupe.get(b.id);
        return instant((db && db.created_at) || b.created_at) - instant((da && da.created_at) || a.created_at);
      }).forEach((g) => {
        const dernier = derniereInterneParGroupe.get(g.id);
        area.appendChild(rangeeFil({
          href: `./equipe.html?groupe=${g.id}#fil`,
          initiales: initialesDe(g.nom || "Groupe"),
          nom: `Groupe · ${g.nom}`,
          apercu: dernier ? (dernier.auteur_id === MON_ID ? "Vous : " : "") + tronquer(apercuContenu(dernier.content)) : "Aucun message pour l'instant.",
          quand: dernier ? heureRelative(dernier.created_at) : "",
          nb: nonLusParGroupe.get(g.id) || 0,
        }));
      });
      groupes.forEach(([id, dernier]) => {
        const c = parId.get(id);
        area.appendChild(rangeeFil({
          href: `./equipe.html?chantier=${id}#fil`,
          initiales: initialesDe(c.client_name || "Chantier"),
          nom: `Groupe · ${c.client_name || "Chantier"}`,
          apercu: (dernier.auteur_id === MON_ID ? "Vous : " : "") + tronquer(apercuContenu(dernier.content)),
          quand: heureRelative(dernier.created_at),
          nb: nonLusInterneParChantier.get(id) || 0,
        }));
      });
      // (07/09/2026, Moctar : « quand je clique dans tous les groupes de
      // chantier ça m'amène à équipe », « je devrais facilement pouvoir créer
      // un groupe, je ne sais pas où »).
      //
      // La rangée « Tous les groupes de chantier » renvoyait vers equipe.html,
      // c'est-à-dire vers l'écran de GESTION de l'équipe — une page de plus
      // avant d'atteindre un fil, alors que les groupes sont déjà listés
      // juste au-dessus. Elle ne servait à rien. Elle est remplacée par ce
      // qui manquait vraiment : créer un groupe.
      //
      // Le chiffre est retiré de cette rangée (« pas la peine de mettre un
      // chiffre dans équipe ») : les non-lus sont déjà portés par chaque
      // groupe, et par la pastille du bandeau du bas.
      if (!groupes.length && !libres.length) {
        area.appendChild(rangeeFil({
          href: "./equipe.html#fil",
          icone: "users",
          nom: "Fil d'équipe",
          apercu: "Échanges internes par chantier, avec vos compagnons.",
          quand: "",
          nb: 0,
        }));
      }
      // La rangée « Nouveau groupe de chantier » est retirée (Moctar, 08/09).
      // Elle s'intercalait entre les groupes et les collègues — c'est ce qui
      // mettait la ligne de Gabriel « pas à la bonne place ». Créer un groupe
      // est une ACTION, pas une conversation : elle a maintenant son icône
      // sous les onglets, et la liste ne contient plus que des fils.
    }

    // Une rangée par collègue qu'on peut contacter en message direct —
    // ajoutée APRÈS la rangée « Fil d'équipe » posée par renderEquipe(), dans
    // la même zone #equipe-area (on ne la vide pas ici, elle l'a déjà été).
    // listContacts() place le patron en premier si je suis un compagnon.
    async function renderCollegues() {
      const area = document.getElementById("equipe-area");
      let monId, contacts;
      try {
        ({ monId, contacts } = await listContacts());
      } catch (e) {
        console.warn("[messages] collègues indisponibles", e);
        return;
      }
      if (!contacts.length) return;

      let apercu = new Map();
      try {
        apercu = monId ? await apercuConversations(monId) : apercu;
      } catch (e) {
        console.warn("[messages] aperçu des messages directs indisponible", e);
      }

      // Les invitations en attente NE FIGURENT PLUS ICI (Moctar, 07/09 :
      // « pourquoi j'ai des invitations en attente dans Messages ? »). Une
      // ligne sur laquelle on ne peut rien faire n'a pas sa place dans une
      // messagerie : tant que la personne n'a pas de compte, il n'y a personne
      // a qui ecrire. Le suivi des invitations vit dans Equipe, ou l'on peut
      // relancer ou annuler.
      // Les conversations directes sortaient dans l'ordre des MEMBRES d'équipe
      // (patron d'abord, puis l'ordre de la table), pas par récence : un
      // message de dimanche pouvait s'afficher sous un message du 31 août
      // (Moctar, 08/09). On trie par date du dernier message, le plus récent
      // d'abord ; les contacts avec qui on n'a jamais parlé ferment la liste.
      const quandAvec = (c) => {
        const d = apercu.get(c.userId);
        return d && d.dernier ? instant(d.dernier.created_at) : 0;
      };
      const contactsTries = contacts.slice().sort((a, b) => quandAvec(b) - quandAvec(a));

      contactsTries.forEach((c) => {
        if (c.enAttente || !c.userId) return;

        const dernier = apercu.get(c.userId);
        area.appendChild(rangeeFil({
          href: `./dm.html?avec=${c.userId}`,
          initiales: initialesDe(c.nom),
          nom: `${c.nom} · ${c.roleLabel}`,
          apercu: dernier
            ? (dernier.dernier.de_user_id === monId ? "Vous : " : "") + tronquer(dernier.dernier.content)
            : "Aucun message pour l'instant.",
          quand: dernier ? heureRelative(dernier.dernier.created_at) : "",
          nb: dernier ? (dernier.nb || 0) : 0,
        }));
      });
    }

    function renderAssistChips() {
      const area = document.getElementById("mqAssistChips");
      area.replaceChildren();
      // (A63, audit 12/09) Sur l'onglet Équipe, des propositions d'équipe — pas celles des clients.
      const ongletEquipe = (document.querySelector('.ui-tab[aria-selected="true"]') || {}).dataset?.onglet === "equipe";
      (ongletEquipe ? ["Message à l'équipe", "Qui travaille demain ?"] : ["Prévenir un client d'un décalage", "Envoyer les photos du jour"]).forEach((label) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "mq-chip";
        chip.textContent = label;
        chip.addEventListener("click", () => {
          if (typeof window.bsAssistantEnvoyerQuestion === "function") {
            window.bsAssistantEnvoyerQuestion(label);
          }
        });
        area.appendChild(chip);
      });
    }

    // ── Onglets Clients / Équipe ──────────────────────────────────────
    const CLE_ONGLET = 'messages_onglet';
    function montrerOnglet(nom) {
      const clients = nom !== 'equipe';
      document.getElementById('clients-area').hidden = !clients;
      document.getElementById('equipe-area').hidden = clients;
      document.querySelectorAll('#msgOnglets .ui-tab').forEach((b) => {
        const on = b.dataset.onglet === (clients ? 'clients' : 'equipe');
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      const barre = document.getElementById('barreGroupe');
      if (barre) barre.hidden = clients;
      try { localStorage.setItem(CLE_ONGLET, clients ? 'clients' : 'equipe'); } catch (_) {}
    }
    function poserBadgeOnglet(id, n) {
      const b = document.getElementById(id);
      if (!b) return;
      b.hidden = !(n > 0);
      b.textContent = n > 99 ? '99+' : String(n);
    }
    document.querySelectorAll('#msgOnglets .ui-tab').forEach((b) => b.addEventListener('click', () => montrerOnglet(b.dataset.onglet)));
    (function ongletInitial() {
      let voulu = null;
      if (location.hash === '#equipe') voulu = 'equipe';
      else if (location.hash === '#clients') voulu = 'clients';
      else { try { voulu = localStorage.getItem(CLE_ONGLET); } catch (_) {} }
      montrerOnglet(voulu || 'clients');
    })();

    async function initMessages() {
      const session = await requireAuth();
      MON_ID = session && session.user ? session.user.id : null;

      const clientsArea = document.getElementById("clients-area");
      const equipeArea = document.getElementById("equipe-area");
      const attente = () => (typeof window.bsSquelette === "function"
        ? window.bsSquelette(2, { court: true })
        : noteCentree("Chargement…"));
      clientsArea.replaceChildren(attente());
      equipeArea.replaceChildren(attente());
      if (typeof window.bsCascade === "function") { window.bsCascade(clientsArea); window.bsCascade(equipeArea); }

      try {
        const { tous, dernierClientParChantier, nonLusParChantier, derniereInterne, nonLusEquipe, derniereInterneParChantier, nonLusInterneParChantier, libres, derniereInterneParGroupe, nonLusParGroupe } = await chargerDonnees();
        renderClients(tous, dernierClientParChantier, nonLusParChantier);
        renderEquipe(derniereInterne, nonLusEquipe, tous, derniereInterneParChantier, nonLusInterneParChantier, libres, derniereInterneParGroupe, nonLusParGroupe);
        await renderCollegues();
        // Non-lus par onglet : clients = messages de clients pas encore
        // ouverts ; équipe = messages internes des autres.
        let nbC = 0; nonLusParChantier.forEach((n) => { nbC += n; });
        poserBadgeOnglet('nbClients', nbC);
        // (plus de chiffre sur l'onglet Équipe — voir le commentaire du balisage)
      } catch (e) {
        // « Indisponible pour le moment » ne se diagnostique pas : c'est ce mur
        // que Moctar a photographié le 08/09. On DIT la cause, et on remet un
        // vrai bouton — une consigne « Réessayez » sans bouton oblige à
        // recharger la page.
        console.error("[messages] chargement impossible", e);
        const m = String((e && e.message) || "");
        const texte = !navigator.onLine
          ? "Pas de réseau : la liste se chargera à la reconnexion."
          : (e && e.delaiDepasse)
            ? "La liste met trop de temps à venir (plus de 15 s). C’est en général le réseau."
            : /jwt|expired|401/i.test(m)
              ? "Votre session a expiré. Rechargez la page pour vous reconnecter."
              : /permission|policy|row-level|403/i.test(m)
                ? "Ces messages ne vous sont pas accessibles. Signalez-le : ce n’est pas normal."
                : `Liste non chargée (${m.slice(0, 90) || "cause inconnue"}).`;
        [clientsArea, equipeArea].forEach((zone) => {
          const bloc = noteCentree(texte);
          const b = document.createElement("button");
          b.type = "button"; b.className = "mq-btn mq-ghost";
          b.style.cssText = "margin:10px auto 0;display:block;min-height:44px;";
          b.textContent = "Réessayer";
          b.addEventListener("click", () => initMessages());
          bloc.appendChild(b);
          zone.replaceChildren(bloc);
        });
      }

      renderAssistChips();
      document.querySelectorAll('.ui-tab').forEach((t) => t.addEventListener('click', () => setTimeout(renderAssistChips, 0)));
      // La liste vient d'être affichée : c'est le bon moment pour rafraîchir
      // le badge de la barre du bas (non bloquant, voir mq-thread.js).
      actualiserBadgeMessages();
    }

    initMessages();
  </script>
