 <script type="module">
 import {
 supabase, getSession, requireAuth, signOut, toast,
 listMyDemandesWithArtisan, listMyClientChantiers, claimOrphanDemandes,
 TYPE_TRAVAUX_LABEL, BUDGET_LABEL, DELAI_LABEL,
 } from './js/supabase.js';
 // Numero appelable depuis n'importe ou — une seule definition, testee.
 import { telAppelable } from './js/tel.js';

 const session = await requireAuth('./client-login.html');
 if (!session) throw new Error('No session');

 // Pas de guard artisan ici — un artisan peut aussi déposer des demandes
 // en tant que client. Les deux espaces (client.html / dashboard.html) sont
 // indépendants et accessibles via leurs URLs respectives.

 const userEmail = session.user.email || '';
 const metaPrenom = (session.user?.user_metadata?.prenom || '').trim();
 // On prefere le prenom saisi par l'user dans son profil. Sinon on tombe
 // sur un greeting neutre ("Bonjour") plutot que sur un prefixe email
 // peu flatteur (ex: "Bonjour mdiaby01").
 if (metaPrenom) {
 document.getElementById('greet').textContent = `Bonjour ${metaPrenom}`;
 } else {
 document.getElementById('greet').textContent = 'Bonjour';
 // Pas de prenom → propose discretement de completer le profil (carte design system, pas bandeau)
 const banner = document.getElementById('profile-banner');
 if (banner) banner.style.display = 'flex';
 }

 // Helper : timeout sur n'importe quel await
 function withTimeout(promise, ms, label) {
 return Promise.race([
 promise,
 new Promise((_, reject) => setTimeout(() => reject(new Error(`Timeout ${label} (${ms}ms)`)), ms))
 ]);
 }

 // Rattacher les demandes anonymes (timeout 3s — non bloquant)
 try { await withTimeout(claimOrphanDemandes(), 3000, 'claimOrphan'); } catch(e) { console.warn('[claim]', e); }

 // ── Helpers ──
 function fmtAgo(dt) {
 const ms = Date.now() - new Date(dt).getTime();
 const min = Math.floor(ms / 60000);
 if (min < 1) return 'à l\'instant';
 if (min < 60) return `il y a ${min} min`;
 const h = Math.floor(min / 60);
 if (h < 24) return `il y a ${h}h`;
 const j = Math.floor(h / 24);
 if (j < 30) return `il y a ${j}j`;
 const mo = Math.floor(j / 30);
 return `il y a ${mo} mois`;
 }

 // Status mapping → mq-pill variant + label + group
 const STATUS_MAP = {
 // demandes_devis
 'nouvelle': { cls: 'mq-wait', label: 'En traitement', group: 'ongoing' },
 'en_traitement': { cls: 'mq-wait', label: 'Mise en relation', group: 'ongoing' },
 'matchee': { cls: 'mq-ok', label: 'Artisan trouvé', group: 'ongoing' },
 'chantier_cree': { cls: 'mq-ok', label: 'Chantier validé',group: 'ongoing' },
 'abandonnee': { cls: 'mq-info', label: 'Abandonnée', group: 'done' },
 // chantiers
 'en_cours': { cls: 'mq-ok', label: 'En cours', group: 'ongoing' },
 'en_attente': { cls: 'mq-wait', label: 'En attente', group: 'ongoing' },
 'retard': { cls: 'mq-wait', label: 'Retard', group: 'ongoing' },
 'termine': { cls: 'mq-ok', label: 'Terminé', group: 'done' },
 };

 // Build a unified item from demande or chantier
 function buildItems(demandes, chantiers) {
 const items = [];
 for (const d of demandes) {
 const map = STATUS_MAP[d.status] || { cls: 'b-grey', label: d.status || 'En traitement', group: 'ongoing' };
 const subParts = [];
 if (d.adresse) subParts.push(d.adresse + (d.code_postal ? ' · ' + d.code_postal : ''));
 else if (d.code_postal) subParts.push(d.code_postal);
 if (d.budget_estime) subParts.push(BUDGET_LABEL[d.budget_estime] || d.budget_estime);
 if (d.delai) subParts.push(DELAI_LABEL[d.delai] || d.delai);
 // Artisan info quand la demande est matchée
 const artisanInfo = (d.artisan_prenom || d.artisan_nom || d.artisan_entreprise)
 ? {
 nom: [d.artisan_prenom, d.artisan_nom].filter(Boolean).join(' '),
 entreprise: d.artisan_entreprise || '',
 telephone: d.artisan_telephone || '',
 }
 : null;
 items.push({
 kind: 'demande',
 id: d.id,
 title: TYPE_TRAVAUX_LABEL[d.type_travaux] || d.type_travaux || 'Demande',
 sub: subParts.join(' · ') || 'En recherche d\'artisan…',
 status: map,
 ts: d.updated_at || d.created_at,
 link: null,
 artisan: artisanInfo,
 });
 }
 for (const c of chantiers) {
 const map = STATUS_MAP[c.status] || { cls: 'b-grey', label: c.status || 'Chantier', group: 'ongoing' };
 const subParts = [];
 if (c.adresse) subParts.push(c.adresse);
 if (c.public_token) subParts.push('suivi disponible');
 items.push({
 kind: 'chantier',
 id: c.id,
 title: c.client_name || 'Chantier',
 sub: subParts.join(' · '),
 status: map,
 ts: c.updated_at,
 link: c.public_token ? `./suivi.html?t=${c.public_token}` : null,
 });
 }
 // Sort by ts desc
 items.sort((a, b) => new Date(b.ts).getTime() - new Date(a.ts).getTime());
 return items;
 }

 function renderItems(items, filter) {
 const area = document.getElementById('items-area');
 area.replaceChildren();
 const filtered = items.filter(it => filter === 'all' ? true : it.status.group === filter);

 if (filtered.length === 0) {
 const empty = document.createElement('div');
 empty.className = 'empty-state';
 const p = document.createElement('p');
 p.textContent = filter === 'all'
 ? "Vous n'avez pas encore déposé de demande."
 : "Aucun résultat dans cet onglet.";
 empty.appendChild(p);
 area.appendChild(empty);
 return;
 }

 filtered.forEach(it => {
 const card = document.createElement(it.link ? 'a' : 'div');
 card.className = 'mq-card';
 card.style.cssText = 'flex-direction:column;align-items:stretch;gap:4px;text-decoration:none;color:inherit';
 if (it.link) { card.href = it.link; }

 const meta = document.createElement('div');
 meta.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:8px';

 const badge = document.createElement('span');
 badge.className = `mq-pill ${it.status.cls}`;
 badge.textContent = it.status.label;
 meta.appendChild(badge);

 const ago = document.createElement('span');
 ago.style.fontSize = '11px';
 ago.style.color = 'var(--muted)';
 ago.style.fontWeight = '700';
 ago.textContent = fmtAgo(it.ts);
 meta.appendChild(ago);

 const title = document.createElement('div');
 title.className = 'mq-t';
 title.textContent = it.title;

 const sub = document.createElement('div');
 sub.style.cssText = 'font-size:12px;color:var(--muted);font-weight:600';
 sub.textContent = it.sub;

 card.appendChild(meta);
 card.appendChild(title);
 card.appendChild(sub);

 // Carte artisan quand la demande est matchée
 if (it.artisan && (it.artisan.nom || it.artisan.entreprise)) {
 const artCard = document.createElement('div');
 artCard.style.cssText = 'margin-top:6px;padding:10px 12px;background:var(--g-soft);border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;gap:10px';

 const avatar = document.createElement('div');
 avatar.style.cssText = 'width:36px;height:36px;border-radius:50%;background:var(--g1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0';
 const initials = ((it.artisan.nom || it.artisan.entreprise || '?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?');
 avatar.textContent = initials;

 const info = document.createElement('div');
 info.style.cssText = 'flex:1;min-width:0';
 const artName = document.createElement('div');
 artName.style.cssText = 'font-weight:800;font-size:13px;color:var(--text)';
 artName.textContent = it.artisan.entreprise || it.artisan.nom;
 info.appendChild(artName);
 if (it.artisan.nom && it.artisan.entreprise) {
 const artSub = document.createElement('div');
 artSub.style.cssText = 'font-size:11px;color:var(--muted);margin-top:1px';
 artSub.textContent = it.artisan.nom;
 info.appendChild(artSub);
 }

 artCard.appendChild(avatar);
 artCard.appendChild(info);

 // `.replace(/\s/g,'')` laissait « 01 48 57 22 40 » en 0148572240 : le 0
 // initial est un prefixe NATIONAL, l'appel echoue depuis l'etranger.
 const numTel = telAppelable(it.artisan.telephone);
 if (numTel) {
 const tel = document.createElement('a');
 tel.href = `tel:${numTel}`;
 tel.className = 'mq-btn mq-primary';
 tel.style.cssText = 'min-height:36px;padding:0 12px;font-size:12px;flex-shrink:0';
 tel.textContent = 'Appeler';
 artCard.appendChild(tel);
 }

 card.appendChild(artCard);
 }

 area.appendChild(card);
 });
 }

 let allItems = [];
 let activeFilter = 'all';

 function applyFilter(f) {
 activeFilter = f;
 document.querySelectorAll('#chip-row .chip').forEach(c => {
 c.classList.toggle('active', c.dataset.filter === f);
 });
 renderItems(allItems, f);
 }

 document.querySelectorAll('#chip-row .chip').forEach(c => {
 c.addEventListener('click', () => applyFilter(c.dataset.filter));
 });

 async function load() {
 try {
 const [demandes, chantiers] = await withTimeout(
 Promise.all([listMyDemandesWithArtisan(), listMyClientChantiers()]),
 6000,
 'load demandes+chantiers'
 );
 allItems = buildItems(demandes || [], chantiers || []);

 // Counts
 document.getElementById('count-all').textContent = String(allItems.length);
 const ongoing = allItems.filter(it => it.status.group === 'ongoing' && it.kind === 'demande').length;
 const chantiersCount = (chantiers || []).length;
 const sub = document.getElementById('sub-line');
 sub.textContent =
 `${ongoing} demande${ongoing > 1 ? 's' : ''} en cours · ${chantiersCount} chantier${chantiersCount > 1 ? 's' : ''}`;

 renderItems(allItems, activeFilter);
 } catch (err) {
 console.error(err);
 const area = document.getElementById('items-area');
 area.replaceChildren();
 const empty = document.createElement('div');
 empty.className = 'empty-state';
 const p = document.createElement('p');
 p.textContent = err.message || 'Erreur de chargement. Réessayez dans un instant.';
 empty.appendChild(p);
 area.appendChild(empty);
 document.getElementById('sub-line').textContent = '—';
 }
 }

 load();
 </script>
