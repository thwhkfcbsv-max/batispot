<body>
  <main>
    <div class="ic-circle" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>

        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>Pas de connexion Internet. Vérifiez votre Wi-Fi ou vos données mobiles, puis réessayez.</p>
    <button type="button" class="retry-btn" id="retry-btn">Réessayer</button>
    <div class="status" id="status">État : hors ligne</div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    function updateStatus() {
      if (navigator.onLine) {
        statusEl.textContent = 'État : connexion rétablie. Cliquez sur Réessayer.';
        statusEl.classList.add('online');
      } else {
        statusEl.textContent = 'État : hors ligne';
        statusEl.classList.remove('online');
      }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();

    document.getElementById('retry-btn').addEventListener('click', () => {
      // Tente de revenir vers la page demandee a l'origine, sinon home
      const intended = sessionStorage.getItem('offline_intended_url');
      window.location.href = intended || './index.html';
    });
  </script>
</body>
