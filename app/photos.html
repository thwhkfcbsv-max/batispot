  <script>
    function showToast(msg) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = 'toast';
      // ⚠️ textContent, PAS innerHTML (01/09/2026). Ce toast affiche des
      // messages qui viennent parfois du LLM — resume d'un ticket passe a
      // l'OCR, cotes lues sur une photo, retour de l'assistant. Un texte
      // ecrit sur un ticket photographie peut porter une instruction, et le
      // modele la restituer telle quelle : le balisage s'executait alors dans
      // l'origine authentifiee de l'artisan.
      const bsT = document.createElement("span");
      bsT.textContent = msg;
      const bsX = document.createElement("span");
      bsX.style.cursor = "pointer";
      bsX.textContent = 'X';
      bsX.addEventListener("click", () => toast.remove());
      toast.replaceChildren(bsT, bsX);
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 250); }, 2500);
    }
  </script>

  <script>
    // Trois temps — Début · Pendant · Fin (06/09/2026). Le temps courant est
    // celui de la case surlignée ; le bouton principal le répète. Déduit au
    // chargement du chantier (bsAppliquerPhaseDeduite, script module plus
    // bas) tant que l'artisan n'a pas tapé lui-même sur une case : son choix
    // prime ensuite, jusqu'au changement de chantier.
    var PHASE_MOTS_PHOTO = { avant: 'Début', pendant: 'Pendant', apres: 'Fin' };
    var phasePhotoCourante = 'pendant';
    var phasePhotoManuelle = false;

    function normaliserPhasePhoto(p) { return p === 'avant' || p === 'apres' ? p : 'pendant'; }

    function choisirPhasePhoto(phase, manuel) {
      phasePhotoCourante = normaliserPhasePhoto(phase);
      if (manuel) phasePhotoManuelle = true;
      var lib = document.getElementById('btnPrendrePhotoLibelle');
      if (lib) lib.textContent = 'Photos « ' + PHASE_MOTS_PHOTO[phasePhotoCourante] + ' »';
      if (typeof window.bsRendreCasesTemps === 'function') window.bsRendreCasesTemps();
    }

    function declencherPrisePhoto() {
      var input = document.getElementById('stepPhotoInput');
      if (input) input.click();
    }
    function declencherImportGalerie() {
      var input = document.getElementById('stepGalerieInput');
      if (input) input.click();
    }

    // Appelée par le script module dès que le temps est déduit pour le
    // chantier sélectionné (aucune étape faite → Début ; toutes terminées
    // → Fin ; sinon → Pendant). Ne remplace jamais un choix manuel.
    window.bsAppliquerPhaseDeduite = function (phase) { if (!phasePhotoManuelle) choisirPhasePhoto(phase); };

    document.addEventListener('DOMContentLoaded', function () { choisirPhasePhoto(phasePhotoCourante); });

    // Icônes SVG communes (aucun emoji dans l'interface, règle du 04/09) :
    // bsIcon() vient de js/app-nav.js, chargé plus bas dans la page (script
    // non différé). Il est donc déjà défini quand ce DOMContentLoaded se
    // déclenche — l'événement n'arrive qu'une fois le parsing terminé.
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof window.bsIcon !== 'function') return;
      var poser = function (id, nom) {
        var b = document.getElementById(id);
        if (b) b.insertAdjacentHTML('afterbegin', window.bsIcon(nom));
      };
      poser('btnPrendrePhoto', 'camera');
      poser('btnDevisPhoto', 'scan');
      poser('btnPrendrePhotoVide', 'camera');
      poser('btnTicketDepense', 'receipt');
    });
  </script>

  <!-- ═══ Analyse de pièce par photo + scan de ticket (rétabli 04/09/2026) ═══
       Ces deux flux avaient été retirés lors de la reconstruction de l'écran
       sur la maquette 07. Le fondateur : « le bouton depuis une photo est
       l'un des atouts majeurs ; c'est l'outil photo qui prend les SURFACES,
       pas une feuille étalon ». On rappelle ici les deux modes serveur déjà
       branchés (scan-room-photo, ocr-receipt) via js/app-photo-ia.js — le
       même module que l'assistant flottant utilise, pour n'avoir qu'un seul
       appelant réel de chaque mode. -->
  <script>
    // Dernier métré estimé par la photo : gardé en mémoire le temps que
    // l'artisan relise le résultat et clique « Créer le devis ». Rien n'est
    // écrit avant ce clic — ce n'est qu'après qu'on pousse vers devis.html.
    var dernierMetreEstime = null;

    function declencherEstimationPhoto() {
      var input = document.getElementById('roomPhotoAIInput');
      if (input) input.click();
    }

    function declencherScanTicket() {
      var input = document.getElementById('receiptScanTabInput');
      if (input) input.click();
    }

    function reprendrePhotoEstimation() {
      var zone = document.getElementById('photoCaptureZone');
      var res = document.getElementById('roomEstimateResult');
      if (res) res.style.display = 'none';
      if (zone) zone.style.display = '';
      declencherEstimationPhoto();
    }

    // Ce bloc RECALCULAIT les murs côté client : L = l = √surface quand les
    // cotes manquaient, hauteur 2,50 m par défaut, ouvertures forfaitisées à
    // 3,30 m² (1 porte + 1 fenêtre supposées), plinthes = périmètre − 0,90.
    // Deuxième jeu de règles de métré dans l'application, en désaccord avec le
    // socle — même photo, deux devis différents — alors que le serveur renvoie
    // le VRAI compte d'ouvertures, ignoré ici. C'est cette duplication qui avait
    // donné le faux « 3 × S ».
    //
    // On n'affiche donc plus que ce que le serveur a mesuré, et le chiffrage
    // repart par le seul chemin qui possède les règles : la phrase composée par
    // app-actions.js (phraseDevisDepuisPhoto) envoyée à l'assistant, qui
    // proposera un creer_devis avec sa carte de validation.
    function afficherResultatEstimation(d) {
      dernierMetreEstime = d;

      var nb = function (v, n) {
        return Number(v).toFixed(n == null ? 1 : n).replace('.', ',');
      };

      var heard = document.getElementById('roomEstimateHeard');
      if (heard) {
        heard.textContent = "J'ai compris : " + (d.typePiece || 'pièce') + ' · environ ' + nb(d.surfaceEstimeeM2) + ' m²'
          + (d.confiance ? ' (confiance ' + d.confiance + ')' : '');
      }

      var lignes = document.getElementById('roomEstimateLines');
      if (lignes) {
        lignes.replaceChildren();
        var ligne = function (label, val) {
          var row = document.createElement('div');
          row.className = 'mq-line';
          var a = document.createElement('span'); a.textContent = label;
          var b = document.createElement('span'); b.textContent = val;
          row.append(a, b);
          lignes.appendChild(row);
        };
        ligne('Surface au sol', nb(d.surfaceEstimeeM2) + ' m²');
        if (Number(d.hauteurSousPlafondM) > 0) ligne('Hauteur sous plafond', nb(d.hauteurSousPlafondM) + ' m');
        var L = Number(d.longueurEstimeeM), l = Number(d.largeurEstimeeM);
        if (L > 0 && l > 0) {
          ligne('Longueur × largeur', nb(L) + ' m × ' + nb(l) + ' m');
          ligne('Périmètre', nb(2 * (L + l)) + ' m');
        } else {
          ligne('Longueur et largeur', 'non déductibles de la photo');
        }
        var ouv = d.ouvertures || {};
        if (Number(ouv.portes) > 0 || Number(ouv.fenetres) > 0) {
          ligne('Ouvertures', (Number(ouv.portes) || 0) + ' porte(s) · ' + (Number(ouv.fenetres) || 0) + ' fenêtre(s)');
        }
      }

      var avert = document.getElementById('roomEstimateAvert');
      if (avert) avert.textContent = d.avertissement || 'Estimation à confirmer sur place avant tout devis.';

      var zone = document.getElementById('photoCaptureZone');
      var res = document.getElementById('roomEstimateResult');
      if (zone) zone.style.display = 'none';
      if (res) res.style.display = 'block';
    }

    // « Créer le devis » : même chemin que l'outil devis_depuis_photo de
    // l'assistant. Les cotes partent TELLES QUELLES au socle, qui possède les
    // règles de métré ; l'artisan valide ensuite la carte du devis. Aucun
    // recalcul ici, aucun prix.
    async function transferRoomMeterToQuote() {
      if (!dernierMetreEstime) { showToast("Aucune estimation à transférer.", true); return; }
      var champ = document.getElementById('roomEstimateOuvrage');
      var ouvrage = champ ? String(champ.value || '').trim() : '';
      if (!ouvrage) {
        showToast("Dites ce qu'il y a à chiffrer (peinture des murs, carrelage au sol…).", true);
        if (champ) champ.focus();
        return;
      }
      if (typeof window.bsAssistantEnvoyerQuestion !== 'function') {
        showToast("L'assistant n'est pas disponible sur cet écran.", true);
        return;
      }
      var mod = await import('./js/app-actions.js');
      window.bsAssistantEnvoyerQuestion(mod.phraseDevisDepuisPhoto(ouvrage, dernierMetreEstime, ''));
    }

    async function handleRoomPhotoAIEstimate(event) {
      var file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file) return;
      showToast('Analyse de la photo en cours…');
      var ia = await import('./js/app-photo-ia.js');
      try {
        var res = await ia.estimerPieceIA(file);
        afficherResultatEstimation(res.data);
      } catch (e) {
        var echec = ia.messageEchecPhoto(e, 'metre');
        showToast(echec.message, true);
      }
    }

    async function handleReceiptScanned(event) {
      var file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file) return;
      showToast('Lecture du ticket en cours…');
      var ia = await import('./js/app-photo-ia.js');
      try {
        var lu = await ia.lireTicketIA(file);
        var d = lu.data;

        // On PROPOSE, l'artisan valide : rien n'est enregistré sans son clic.
        var choix = await confirmerDepense(d);
        if (!choix) { showToast('Dépense non enregistrée.'); return; }

        // Le justificatif : un échec de dépôt ne doit pas faire perdre la
        // dépense elle-même — on l'enregistre sans.
        var justificatif = null;
        try {
          var supa = await import('./js/supabase.js');
          justificatif = await supa.uploadJustificatif(lu.fichierReduit);
        } catch (eUp) {
          console.warn('[depense] justificatif non conservé', eUp);
        }

        var mod = await import('./js/app-actions.js');
        var resultat = await mod.executerAction('enregistrer_depense', {
          fournisseur: d.supplier,
          date_achat: d.date,
          categorie: (d.category || 'Materiaux').split(' ')[0].replace('é', 'e'),
          montant_ht: d.totalHT,
          tva: d.vatRate,
          montant_ttc: d.totalTTC,
          designation: Array.isArray(d.items) ? d.items.map(function (i) { return i.name; }).join(', ') : null,
          items: Array.isArray(d.items) ? d.items : null,
          source: 'ocr',
          confiance_ocr: d.confidence,
          chantier_id: choix.chantier_id,
          justificatif_path: justificatif,
        });
        showToast(resultat.message);
      } catch (e) {
        var echec = ia.messageEchecPhoto(e, 'ticket');
        showToast(echec.message, true);
      }
    }

    // Confirmation d'une dépense lue sur un ticket. Renvoie { chantier_id } si
    // l'artisan valide, null s'il annule. Reprend la liste de chantiers déjà
    // chargée en haut de l'écran, avec le chantier courant présélectionné.
    function confirmerDepense(d) {
      return new Promise((resolve) => {
        const overlay  = document.getElementById('depOverlay');
        const recap    = document.getElementById('depRecap');
        const select   = document.getElementById('depChantier');
        const btnOk    = document.getElementById('depValider');
        const btnNon   = document.getElementById('depAnnuler');
        // Garde-fou : si la fenetre manque, on ne bloque pas l'artisan.
        if (!overlay || !recap || !select || !btnOk || !btnNon) {
          resolve({ chantier_id: null });
          return;
        }

        const euros = (n) => (Number(n) || 0).toLocaleString('fr-FR', {
          style: 'currency', currency: 'EUR', maximumFractionDigits: 2,
        });
        const ligne = (libelle, valeur, fort) => {
          const l = document.createElement('div');
          l.style.cssText = 'display:flex;justify-content:space-between;gap:12px;font-size:13px;';
          const g = document.createElement('span');
          g.style.color = '#5A7268';
          g.textContent = libelle;
          const v = document.createElement(fort ? 'strong' : 'span');
          v.style.cssText = 'color:#1C2B22;text-align:right;';
          v.textContent = valeur;
          l.append(g, v);
          return l;
        };

        recap.textContent = '';
        recap.appendChild(ligne('Fournisseur', d.supplier || 'non lu'));
        if (d.date) recap.appendChild(ligne('Date', d.date));
        recap.appendChild(ligne('Montant HT', euros(d.totalHT)));
        recap.appendChild(ligne('TVA', `${d.vatRate != null ? d.vatRate : 20} %`));
        recap.appendChild(ligne('Total TTC', euros(d.totalTTC), true));
        recap.appendChild(ligne('Poste', d.category || 'Matériaux'));
        // La fiabilite n'est affichee que si elle est basse : au-dessus, elle
        // n'apporte rien et encombre. En dessous, elle invite a relire.
        if (d.confidence != null && Number(d.confidence) < 80) {
          const avert = document.createElement('div');
          avert.style.cssText = 'font-size:12px;color:#B45309;font-weight:700;margin-top:2px;';
          avert.textContent = `Lecture incertaine (${Math.round(Number(d.confidence))} %) — vérifiez les montants.`;
          recap.appendChild(avert);
        }

        // On recopie les chantiers deja charges par le selecteur de la page.
        const source = document.getElementById('photoChantierSelect');
        select.textContent = '';
        const aucun = document.createElement('option');
        aucun.value = '';
        aucun.textContent = 'Aucun chantier';
        select.appendChild(aucun);
        if (source) {
          Array.from(source.options).forEach((o) => {
            // `__new__` est l'entree « + Nouveau chantier… » du selecteur de la
            // page : elle ouvre un formulaire de creation, ce qu'on ne sait pas
            // faire depuis cette fenetre. La proposer serait un cul-de-sac.
            if (!o.value || o.value === '__new__') return;
            const opt = document.createElement('option');
            opt.value = o.value;
            opt.textContent = o.textContent;
            select.appendChild(opt);
          });
          if (source.value) select.value = source.value;
        }

        const fermer = (valeur) => {
          overlay.style.display = 'none';
          btnOk.removeEventListener('click', onOui);
          btnNon.removeEventListener('click', onNon);
          overlay.removeEventListener('click', onFond);
          document.removeEventListener('keydown', onEchap);
          resolve(valeur);
        };
        const onOui   = () => fermer({ chantier_id: select.value || null });
        const onNon   = () => fermer(null);
        const onFond  = (e) => { if (e.target === overlay) fermer(null); };
        const onEchap = (e) => { if (e.key === 'Escape') fermer(null); };

        btnOk.addEventListener('click', onOui);
        btnNon.addEventListener('click', onNon);
        overlay.addEventListener('click', onFond);
        document.addEventListener('keydown', onEchap);
        overlay.style.display = 'flex';
        btnOk.focus();
      });
    }
  </script>

  <!-- ═══ Photo Studio RÉEL (21/08/2026) ═══
       Avant : les <input type=file> affichaient un simple toast, aucune photo n'était
       enregistrée (0 appel Supabase). Ici on branche la vraie couche : garde d'accès,
       vrais chantiers, upload storage + ligne en base, galerie relue depuis le serveur. -->
  <script type="module">
    import { requireAuth, listChantiers, createChantier, uploadPhoto, listPhotos, signPhotoUrls, listTachesChantier,
             deletePhoto, setPhotosVisiblesClient, setPhotoRoleClient }
      from './js/supabase.js';
    import { deduirePhase, rendreCasesTemps, rendreBlocAvapArtisan, creerGalerie, envoyerFichiersPhotos }
      from './js/photos-galerie.js';

    const sel      = document.getElementById('photoChantierSelect');
    const hint     = document.getElementById('photoChantierHint');
    const gal      = document.getElementById('photoGallery');
    const count    = document.getElementById('photoCount');
    const btnEnvoyer = document.getElementById('btnEnvoyerPhotosClient');
    const mqAssist = document.getElementById('mqPhotoAssist');
    const say   = (m, warn) => { try { showToast(m, !!warn); } catch (e) { console.log(m); } };

    // Chantiers chargés, par id — garde public_token pour « Envoyer les
    // photos au client » (le <select> ne porte que id + libellé).
    let chantiersParId = {};

    // Contexte d'écran (task 5). `phasePhotoCourante` est un `var` d'un
    // <script> classique plus haut (choisirPhasePhoto) : accessible ici via
    // window puisque `var` top-niveau d'un script classique se pose sur
    // l'objet global, que ce module-ci peut lire.
    window.bsContexteEcran = () => {
      const id = sel.value;
      const ch = (id && id !== '__new__') ? chantiersParId[id] : null;
      return {
        page: 'photos',
        chantier_id: ch ? id : null,
        chantier_client: ch ? (ch.client_name || null) : null,
        phase: window.phasePhotoCourante || null,
      };
    };

    // Un fetch qui n'atteint jamais le serveur (TypeError « Failed to fetch »
    // sur Chrome, « Load failed » sur Safari) n'est ni une photo ratee ni une
    // panne serveur : c'est l'absence de reseau sur le chantier. Sans cette
    // distinction, l'artisan hors couverture lisait « Ticket illisible » ou
    // « Echec » sans savoir qu'il suffit de reessayer une fois connecte.
    function estErreurReseau(e) {
      if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
      return e instanceof TypeError;
    }

    const session = await requireAuth('./login.html');
    if (!session) throw new Error('no session');


    async function loadChantiers(preselect) {
      let list = [];
      let echec = false;
      // Distinguer « pas encore de chantier » d'une panne reseau/serveur : sans
      // ca, un artisan hors couverture sur son chantier lisait « Aucun chantier :
      // creez-en un » et pouvait creer un doublon, alors que ses chantiers
      // existent deja et que c'est juste la requete qui a echoue.
      try { list = await listChantiers(); } catch (e) { console.warn(e); echec = true; }
      sel.innerHTML = '';
      chantiersParId = {};
      list.forEach(c => {
        chantiersParId[c.id] = c;
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = c.client_name + (c.adresse ? ' — ' + c.adresse : '');
        sel.appendChild(o);
      });
      const nouveau = document.createElement('option');
      nouveau.value = '__new__';
      nouveau.textContent = '+ Nouveau chantier…';
      sel.appendChild(nouveau);

      if (echec) {
        hint.textContent = "Chantiers indisponibles (réseau ou serveur) — réessayez, ils ne sont pas perdus.";
        say('Chargement des chantiers impossible pour le moment.', true);
        if (!list.length) sel.value = '__new__';
      } else if (!list.length) {
        hint.textContent = "Aucun chantier : créez-en un pour enregistrer vos photos.";
        sel.value = '__new__';
      } else {
        hint.textContent = '';
        sel.value = preselect && list.some(c => c.id === preselect) ? preselect : list[0].id;
      }
      await refreshGallery();
    }

    // Le temps proposé suit le chantier (deduirePhase, js/photos-galerie.js).
    // Renvoie null si les étapes n'ont pas pu être lues (réseau ou serveur) :
    // on ne force alors aucun temps, l'artisan garde la case courante.
    async function deduirePhaseChantier(chantierId) {
      try {
        return deduirePhase(await listTachesChantier(chantierId));
      } catch (e) {
        console.warn('[phase déduite] indisponible', e);
        return null;
      }
    }

    // ── Avant / après ─────────────────────────────────
    // Les deux photos MARQUÉES « Avant » / « Après » par l'artisan
    // (photos.role_client) — rendreBlocAvapArtisan (js/photos-galerie.js).
    // Id passé explicitement : sel.value peut avoir changé pendant une
    // requête async.
    function renderAvantApres(id, photos) {
      const sec = document.getElementById('photoAvantApresSec');
      const card = document.getElementById('photoAvantApresCard');
      const partagerBtn = document.getElementById('photoAvantApresPartager');
      if (!sec || !card) return;

      if (!id || id === '__new__') {
        sec.style.display = 'none';
        card.style.display = 'none';
        if (partagerBtn) partagerBtn.style.display = 'none';
        return;
      }

      const { avant, apres } = rendreBlocAvapArtisan(card, photos);
      sec.style.display = '';
      card.style.display = '';
      if (partagerBtn) {
        const token = chantiersParId[id]?.public_token;
        partagerBtn.style.display = token && avant && apres ? 'flex' : 'none';
      }
    }

    // Web Share API si dispo, sinon repli sur la copie du lien — même lien
    // de suivi que bsEnvoyerPhotosClient() plus bas.
    window.bsPartagerAvantApres = async function () {
      const ch = chantiersParId[sel.value];
      if (!ch || !ch.public_token) { say('Lien client indisponible pour ce chantier.', true); return; }
      const cfg = window.__BATISPOT_CONFIG__ || {};
      const url = (cfg.SUIVI_URL || 'https://batispot.pro/app/suivi.html') + '?t=' + ch.public_token;
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Avant / après du chantier', text: 'Suivez l’avancement du chantier en photos.', url });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(url);
        say('Lien copié — envoyez-le à votre client pour qu’il voie les photos.');
      } catch (e) {
        window.prompt('Copiez ce lien et envoyez-le à votre client :', url);
      }
    };
    document.getElementById('photoAvantApresPartager').addEventListener('click', window.bsPartagerAvantApres);

    // ── Galerie : groupes, appui long, sélection, barre d'actions ──
    // Une seule implémentation, partagée avec chantier.html (js/photos-galerie.js).
    let photosCourantes = [];
    let phaseProposeeCourante = null;
    const notifier = (m, t) => say(m, t === 'error');

    const galerie = creerGalerie({
      conteneur: gal,
      notifier,
      onAjouter: () => { if (typeof declencherPrisePhoto === 'function') declencherPrisePhoto(); },
      actions: {
        envoyerClient: (ids, visible) => setPhotosVisiblesClient(ids, visible),
        marquerRole: (id, role) => setPhotoRoleClient(sel.value, id, role),
        supprimer: async (ids) => {
          for (const id of ids) {
            const p = photosCourantes.find((x) => x.id === id);
            if (p) await deletePhoto({ id: p.id, storage_path: p.storage_path });
          }
        },
      },
      apresAction: () => refreshGallery({ silencieux: true }),
    });

    // Puce « Envoyer au client » : on ouvre la sélection, l'artisan coche.
    window.bsChoisirPhotosClient = function () {
      if (!photosCourantes.length) { say('Aucune photo à envoyer pour ce chantier.', true); return; }
      galerie.entrerSelection();
      say('Touchez les photos à envoyer, puis « Envoyer au client ».');
    };

    function rendreCases() {
      rendreCasesTemps(document.getElementById('photoPhaseTemps'), {
        photos: photosCourantes,
        phaseChoisie: window.phasePhotoCourante || 'pendant',
        phaseProposee: phaseProposeeCourante,
        onChoisir: (phase) => { if (typeof choisirPhasePhoto === 'function') choisirPhasePhoto(phase, true); },
      });
    }
    window.bsRendreCasesTemps = rendreCases;

    // `silencieux` : rafraîchissement après une action ou pendant une
    // rafale — la galerie reste affichée et se met à jour, sans repasser
    // par la déduction du temps (le choix de l'artisan tient).
    async function refreshGallery({ silencieux = false } = {}) {
      const id = sel.value;
      if (btnEnvoyer) btnEnvoyer.style.display = 'none';
      if (mqAssist) mqAssist.style.display = 'none';
      if (!id || id === '__new__') {
        photosCourantes = [];
        gal.replaceChildren();
        galerie.quitterSelection();
        renderAvantApres(id, []);
        rendreCases();
        count.textContent = '—'; count.hidden = true;
        return;
      }

      if (btnEnvoyer) btnEnvoyer.style.display = chantiersParId[id]?.public_token ? 'flex' : 'none';

      // Ne bloque pas l'affichage des photos : la déduction est un
      // complément, pas une condition.
      if (!silencieux) {
        deduirePhaseChantier(id).then((phase) => {
          if (!phase || sel.value !== id) return;
          phaseProposeeCourante = phase;
          if (typeof window.bsAppliquerPhaseDeduite === 'function') window.bsAppliquerPhaseDeduite(phase);
          rendreCases();
        });
      }

      let photos = [];
      try {
        photos = await signPhotoUrls(await listPhotos(id));
      } catch (e) {
        console.warn(e);
        count.textContent = '—'; count.hidden = true;
        say('Galerie indisponible pour le moment (réseau ou serveur).', true);
        renderAvantApres(id, []);
        return;
      }
      if (sel.value !== id) return; // le chantier a changé pendant la requête

      photosCourantes = photos || [];
      count.textContent = photosCourantes.length + (photosCourantes.length > 1 ? ' photos' : ' photo');
      count.hidden = photosCourantes.length === 0;
      renderAvantApres(id, photosCourantes);
      rendreCases();
      if (mqAssist) mqAssist.style.display = photosCourantes.length ? 'flex' : 'none';
      galerie.rendre(photosCourantes);
    }

    async function askNewChantier() {
      const nom = (prompt('Nom du client pour ce nouveau chantier :') || '').trim();
      if (!nom) { await loadChantiers(); return null; }
      const adresse = (prompt('Adresse du chantier (facultatif) :') || '').trim();
      try {
        const c = await createChantier({ client_name: nom, adresse: adresse || null });
        say('Chantier « ' + nom + ' » créé');
        await loadChantiers(c.id);
        return c.id;
      } catch (e) { say('Création impossible : ' + (e.message || e), true); return null; }
    }

    sel.addEventListener('change', async () => {
      window.phasePhotoManuelle = false;
      if (sel.value === '__new__') await askNewChantier();
      else await refreshGallery();
    });

    // Prise en rafale (stepPhotoInput) ou import depuis la galerie
    // (stepGalerieInput) : même traitement, dans le temps courant. Chaque
    // photo apparaît dans sa section dès son envoi, sans légende demandée.
    window.bsUploadChantierPhoto = async function (event, phase) {
      const input = event.target;
      const files = Array.from(input.files || []);
      input.value = '';
      if (!files.length) return;

      let chantierId = sel.value;
      if (!chantierId || chantierId === '__new__') chantierId = await askNewChantier();
      if (!chantierId) { say('Choisissez ou créez un chantier avant d’envoyer une photo.', true); return; }

      await envoyerFichiersPhotos({
        files,
        chantierId,
        phase: phase || window.phasePhotoCourante || 'pendant',
        uploadPhoto,
        notifier,
        apresChaque: () => refreshGallery({ silencieux: true }),
      });
    };

    // « Copier le lien client » — même mécanisme que le bouton de
    // chantier.js : le lien de suivi public (suivi.html?t=<public_token>).
    // Ce qui s'y voit se choisit photo par photo dans la galerie (« Envoyer
    // au client ») ; le lien seul ne montre rien. Masqué quand le chantier
    // sélectionné n'a pas de public_token.
    window.bsEnvoyerPhotosClient = async function () {
      const ch = chantiersParId[sel.value];
      if (!ch || !ch.public_token) { say('Lien client indisponible pour ce chantier.', true); return; }
      const cfg = window.__BATISPOT_CONFIG__ || {};
      const url = (cfg.SUIVI_URL || 'https://batispot.pro/app/suivi.html') + '?t=' + ch.public_token;
      try {
        await navigator.clipboard.writeText(url);
        say('Lien copié — votre client y verra les photos que vous lui avez envoyées.');
      } catch (e) {
        window.prompt('Copiez ce lien et envoyez-le à votre client :', url);
      }
    };

    // `?chantier=`, `?phase=`, `?declencher=1` (task 6, prendre_photo /
    // ouvrir_ecran) : présélectionne le chantier, la phase, et déclenche
    // directement la prise de vue — même geste qu'un artisan qui choisirait
    // le chantier, la case Début / Pendant / Fin puis appuierait sur le
    // bouton « Photos « … » ».
    const bsParamsPhotos = new URLSearchParams(location.search);
    await loadChantiers(bsParamsPhotos.get('chantier') || undefined);
    const bsPhaseUrl = bsParamsPhotos.get('phase');
    if (bsPhaseUrl && typeof choisirPhasePhoto === 'function') choisirPhasePhoto(bsPhaseUrl, true);
    if (bsParamsPhotos.get('declencher') === '1' && typeof declencherPrisePhoto === 'function') {
      declencherPrisePhoto();
      // Un .click() sur <input type=file capture> hors geste utilisateur
      // peut être ignoré (iOS Safari) : on prévient l'artisan au cas où.
      if (typeof showToast === 'function') {
        showToast("Si l'appareil photo ne s'est pas ouvert, touchez le bouton « Photos ».");
      }
    }
  </script>

  <!-- ═══ Confirmation d'une depense lue sur un ticket ══════════════════════
       Le choix du chantier reprend la liste deja chargee en haut de l'ecran,
       avec le chantier courant preselectionne — c'est presque toujours le
       bon, l'artisan photographie son ticket sur place. ═══════════════════ -->
  <div id="depOverlay" role="dialog" aria-modal="true" aria-labelledby="depTitre"
       style="position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(4px);
              z-index:2000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:#FFF;border-radius:18px 18px 0 0;width:100%;max-width:480px;
                padding:20px 18px calc(20px + env(safe-area-inset-bottom));
                display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow-y:auto;">
      <div>
        <strong id="depTitre" style="font-size:16px;color:#1C2B22;">Enregistrer cette dépense</strong>
        <p style="font-size:12.5px;color:#5A7268;margin:4px 0 0;">Vérifiez ce qui a été lu sur le ticket.</p>
      </div>

      <div id="depRecap" style="background:#F7FBF8;border:1px solid #E7EEEA;border-radius:12px;
                                padding:12px 14px;display:flex;flex-direction:column;gap:7px;"></div>

      <div style="display:flex;flex-direction:column;gap:5px;">
        <label for="depChantier" style="font-size:11.5px;font-weight:800;color:#5A7268;">
          Chantier concerné
        </label>
        <select id="depChantier" class="form-input" style="font-weight:700;font-size:16px;"></select>
        <span style="font-size:11px;color:#5A7268;">
          Sans chantier, la dépense compte dans vos totaux mais pas dans la marge.
        </span>
      </div>

      <div style="display:flex;gap:9px;">
        <button type="button" id="depAnnuler" class="btn-card" style="flex:1;padding:12px;font-size:13.5px;">Annuler</button>
        <button type="button" id="depValider" class="btn-card primary" style="flex:2;padding:12px;font-size:13.5px;">Enregistrer</button>
      </div>
    </div>
  </div>
