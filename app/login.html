<body>
  <div class="app-shell">
    <div style="text-align:center;padding:32px 20px 0">

        <svg width="212" height="44" viewBox="0 0 240 48" xmlns="http://www.w3.org/2000/svg" aria-label="BatiSpot Pro">
          <defs><linearGradient id="lg-pro" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#228B5B"/><stop offset="100%" stop-color="#4CAF82"/></linearGradient></defs>
          <rect width="40" height="40" rx="10" y="4" fill="url(#lg-pro)"/>
          <path d="M20 12 L10 20 L10 32 L30 32 L30 20 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          <rect x="17" y="24" width="6" height="8" rx="1" fill="white" opacity="0.9"/>
          <text x="50" y="32" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="26" fill="#0A1D14" letter-spacing="-0.5">BatiSpot</text>
          <rect x="176" y="13" width="52" height="22" rx="7" fill="#228B5B"/>

    <main class="container" style="max-width:420px;margin:0 auto;padding:24px 20px 48px">
      <p class="page-sub" style="text-align:center;margin-bottom:24px">Vos devis, vos chantiers, vos factures. Depuis le chantier.</p>

      <div class="card">
        <form id="login-form">
          <div class="form-group">
            <label for="f-email">Email professionnel</label>
            <input type="email" id="f-email" class="form-control" required autocomplete="email" placeholder="vous@votre-entreprise.fr">
          </div>
          <div class="bs-turnstile" data-action="login_pro" style="margin:8px 0"></div>
          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Recevoir mon lien</button>
        </form>

        <div style="display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em">
          <div style="flex:1;height:1px;background:#E5E7EB"></div>
          <span>OU</span>
          <div style="flex:1;height:1px;background:#E5E7EB"></div>
        </div>

        <button type="button" id="google-btn" class="mq-btn mq-ghost" style="width:100%">
          <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          Continuer avec Google
        </button>

        <div id="sent-area" class="hidden" style="text-align:center;margin-top:14px">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--t1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-bottom:6px">
            <circle cx="12" cy="12" r="10"/><polyline points="8 12.5 10.5 15 16 9"/>
          </svg>
          <p style="color:var(--t1);font-weight:700">Email envoyé !</p>
          <p class="form-hint" id="sent-hint">Ouvrez votre email et cliquez sur le lien, ou saisissez le code à 8 chiffres ci-dessous.</p>
          <!-- Le code est indispensable dans l'application native : un lien magique
               s'y ouvrirait dans le navigateur et laisserait l'application deconnectee.
               Sur le web il sert de repli quand le lien est capricieux (Outlook qui
               le pre-visite et le consomme, par exemple). -->
          <form id="code-form" style="margin-top:16px;display:flex;flex-direction:column;gap:10px;align-items:center">
            <input id="code-input" inputmode="numeric" autocomplete="one-time-code"
                   pattern="[0-9]*" maxlength="8" placeholder="00000000"
                   aria-label="Code à 8 chiffres reçu par email"
                   style="width:190px;text-align:center;font-size:26px;font-weight:800;letter-spacing:0.18em;padding:12px;border:1.5px solid #D3E3DA;border-radius:12px;color:var(--t1);background:#F7FBF8">
            <button type="submit" id="code-btn" class="mq-btn mq-ghost" style="width:100%">Me connecter</button>
          </form>
          <p class="form-hint" style="margin-top:12px">
            <a href="#" id="renvoyer" style="color:var(--t1)">Renvoyer un email</a>
          </p>
        </div>
      </div>

      <div class="card" style="text-align:center;margin-top:16px">

      </div>

      <p class="mt-12 text-center" style="font-size:12px;color:var(--muted);">

  <script src="./js/config.js"></script>
  <script src="./js/app-alerte.js?v=2026_08_31" defer></script>
  <!-- Vigie connexions (05/09/2026) : capte l'e-mail d'une tentative REFUSEE.
       `defer` et pas `async` : le module de la page peut l'appeler des le premier
       clic, il doit donc etre defini avant l'execution du script de page. -->
  <script src="./js/app-vigie.js?v=2026_09_05" defer></script>
  <script type="module">
    import { supabase, toast , memoriserEspace} from './js/supabase.js';

    // Porte d'entree : sert a trancher si la base ne connait pas encore
    // le compte. Sans ca, tout nouvel artisan atterrissait cote client.
    memoriserEspace('pro');

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const sentArea = document.getElementById('sent-area');
    // L'artisan doit arriver dans SON espace, pas dans l'espace client
    const NEXT = './welcome.html';

    document.getElementById('google-btn').addEventListener('click', async () => {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: `${window.location.origin}/app/auth-callback.html?next=${NEXT}` },
      });
      if (error) toast(error.message || 'Connexion Google indisponible', 'error');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.replaceChildren();
      const sp = document.createElement('span'); sp.className = 'loading'; submitBtn.appendChild(sp);
      try {
        const email = document.getElementById('f-email').value.trim().toLowerCase();
        const redirectTo = `${window.location.origin}/app/auth-callback.html?next=${NEXT}`;
        // Le widget etait affiche depuis des semaines sans que son token soit
        // jamais lu : n'importe quel script pouvait faire envoyer des magic
        // links en boucle. captchaToken est verifie NATIVEMENT par Supabase
        // Auth avant l'envoi — pas besoin de repasser par verify-turnstile ici.
        // On ATTEND le token au lieu de le lire au vol. Le captcha est active
        // cote Supabase Auth : un token vide = connexion refusee. Or il est
        // vide dans deux cas frequents — le challenge n'est pas fini, ou le
        // token a expire (~300 s) parce que la page est restee ouverte.
        // Avant ce garde-fou, l'utilisateur recevait une erreur Supabase brute
        // sans rapport visible avec le captcha.
        let captchaToken;
        if (window.bsTurnstile && window.bsTurnstile.waitForToken) {
          captchaToken = await window.bsTurnstile.waitForToken(form, 8000);
        } else if (window.bsTurnstile && window.bsTurnstile.getToken) {
          captchaToken = window.bsTurnstile.getToken(form);
        }
        if (!captchaToken) {
          if (window.bsTurnstile && window.bsTurnstile.reset) window.bsTurnstile.reset();
          throw new Error('La vérification antispam n’a pas abouti. Patientez deux secondes et réessayez.');
        }
        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: redirectTo, shouldCreateUser: true, captchaToken },
        });
        if (error) throw error;
        if (window.bsTurnstile && window.bsTurnstile.reset) window.bsTurnstile.reset();
        form.classList.add('hidden');
        sentArea.classList.remove('hidden');
      } catch (err) {
        // Phase pilote (05/09/2026) : les inscriptions sont fermées côté Supabase
        // (disable_signup). Un e-mail inconnu reçoit « Signups not allowed » :
        // on le dit en français, avec la porte à frapper.
        const ferme = /signups? not allowed/i.test(err.message || '');
        // Vigie (05/09/2026) : c'est le SEUL endroit ou l'adresse tentee existe
        // encore. Cote serveur elle a disparu — les logs Auth n'ecrivent que
        // l'IP et le code d'erreur, et `auth.audit_log_entries` est vide.
        if (ferme && window.bsJournaliserTentative) {
          window.bsJournaliserTentative({
            email: document.getElementById('f-email').value.trim().toLowerCase(),
            source: 'login-pro', motif: 'signup_ferme', detail: 'lien magique',
          });
        }
        toast(ferme
          ? 'BatiSpot est en phase pilote, sur invitation. Écrivez à contact@batispot.pro pour demander un accès.'
          : err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Recevoir mon lien';
      }
    });

    // --- Connexion par code a 8 chiffres ---------------------------------
    // Seul chemin viable dans l'application native : Google interdit l'OAuth en
    // WebView, et un lien magique ouvrirait le navigateur au lieu de l'app.
    // Sur le web, c'est un repli utile quand le lien est consomme par un
    // antivirus ou un scanner de messagerie avant que l'artisan ne clique.
    const codeForm = document.getElementById('code-form');
    const codeInput = document.getElementById('code-input');
    const codeBtn = document.getElementById('code-btn');

    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 8);
    });

    codeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = codeInput.value.trim();
      if (token.length !== 8) { toast('Le code fait 8 chiffres.', 'error'); return; }
      codeBtn.disabled = true;
      codeBtn.textContent = 'Vérification…';
      try {
        const email = document.getElementById('f-email').value.trim().toLowerCase();
        const { error } = await supabase.auth.verifyOtp({ email, token, type: 'email' });
        if (error) throw error;
        window.location.href = NEXT;
      } catch (err) {
        // Message utile plutot que le libelle brut de Supabase : les deux causes
        // reelles sont un code mal recopie et un code perime (1 h).
        toast('Code incorrect ou expiré. Vérifiez-le, ou demandez-en un nouveau.', 'error');
        codeBtn.disabled = false;
        codeBtn.textContent = 'Me connecter';
        codeInput.select();
      }
    });

    document.getElementById('renvoyer').addEventListener('click', (e) => {
      e.preventDefault();
      sentArea.classList.add('hidden');
      form.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Recevoir mon lien';
      codeInput.value = '';
    });
  </script>
  <script src="/js/update-detector.js" defer></script>
</body>
