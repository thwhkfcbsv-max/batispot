 <script type="module">
 import {
 requireAuth, toast, fmtDate,
 listMyDemandesWithArtisan, listClientDocs,
 uploadClientDoc, deleteClientDoc, clientDocSignedUrl,
 TYPE_TRAVAUX_LABEL, DOC_TYPE_LABEL,
 } from './js/supabase.js';

 const session = await requireAuth('./client-login.html');
 if (!session) throw new Error('No session');

 const loadingArea = document.getElementById('loading-area');
 const docsArea = document.getElementById('docs-area');

 // Escape HTML — évite XSS quand le contenu vient de l'utilisateur
 function esc(s) {
 return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 }

 function fmtSize(bytes) {
 if (!bytes) return '';
 if (bytes < 1024) return bytes + ' o';
 if (bytes < 1048576) return Math.round(bytes / 1024) + ' Ko';
 return (bytes / 1048576).toFixed(1) + ' Mo';
 }

 // ── Icône selon extension ──────────────────────────────
 function makeDocIcon(fileName) {
 const ext = (fileName || '').split('.').pop().toLowerCase();
 const isPdf = ext === 'pdf';
 const isImg = ['jpg','jpeg','png','webp','heic','gif'].includes(ext);
 const cls = isPdf ? 'pdf' : isImg ? 'img' : 'def';

 const wrap = document.createElement('div');
 wrap.className = 'doc-icon-wrap ' + cls;

 const svgNS = 'http://www.w3.org/2000/svg';
 const svg = document.createElementNS(svgNS, 'svg');
 svg.setAttribute('width','16'); svg.setAttribute('height','16');
 svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none');
 svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','2');
 svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
 svg.setAttribute('aria-hidden','true');

 const paths = isPdf
 ? [['path','M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z'],
 ['polyline','14 2 14 8 20 8'],['line','x1=16 y1=13 x2=8 y2=13'],['line','x1=16 y1=17 x2=8 y2=17']]
 : isImg
 ? [['rect','x=3 y=3 width=18 height=18 rx=2'],['circle','cx=8.5 cy=8.5 r=1.5'],['polyline','21 15 16 10 5 21']]
 : [['path','M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z'],['polyline','14 2 14 8 20 8']];

 for (const [tag, attrs] of paths) {
 const el = document.createElementNS(svgNS, tag);
 if (tag === 'path') el.setAttribute('d', attrs);
 else if (tag === 'polyline') el.setAttribute('points', attrs);
 else { attrs.split(' ').forEach(a => { const [k,v] = a.split('='); el.setAttribute(k,v); }); }
 svg.appendChild(el);
 }
 wrap.appendChild(svg);
 return wrap;
 }

 // ── Pilule par type de document ────────────────────────
 const DOC_PILL_VARIANT = { plan: 'mq-info', devis: 'mq-wait', facture: 'mq-ok', photo: 'mq-info', autre: 'mq-info' };

 // ── Ligne document ────────────────────────────────────
 function makeDocRow(doc, userId, onDelete) {
 const row = document.createElement('div');
 row.className = 'mq-card doc-row';

 row.appendChild(makeDocIcon(doc.file_name));

 const info = document.createElement('div');
 info.className = 'doc-info';
 const nameEl = document.createElement('div');
 nameEl.className = 'doc-name';
 nameEl.textContent = doc.file_name;
 const metaEl = document.createElement('div');
 metaEl.className = 'doc-meta';
 const uploaderTag = doc.uploader_role === 'artisan' ? ' · Artisan' : '';
 metaEl.textContent = [fmtSize(doc.file_size), fmtDate(doc.created_at)].filter(Boolean).join(' · ') + uploaderTag;
 info.appendChild(nameEl);
 info.appendChild(metaEl);
 row.appendChild(info);

 const badge = document.createElement('span');
 badge.className = 'mq-pill ' + (DOC_PILL_VARIANT[doc.doc_type] || 'mq-info');
 badge.textContent = DOC_TYPE_LABEL[doc.doc_type] || doc.doc_type;
 row.appendChild(badge);

 const actions = document.createElement('div');
 actions.className = 'doc-actions';

 // Download button
 const dlBtn = document.createElement('button');
 dlBtn.className = 'doc-btn dl';
 dlBtn.title = 'Télécharger';
 dlBtn.setAttribute('aria-label', 'Télécharger ' + doc.file_name);
 const dlSvg = makeSvg('<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>');
 dlBtn.appendChild(dlSvg);
 dlBtn.addEventListener('click', async () => {
 try {
 const url = await clientDocSignedUrl(doc.storage_path);
 const a = document.createElement('a');
 a.href = url; a.download = doc.file_name; a.target = '_blank';
 document.body.appendChild(a); a.click(); document.body.removeChild(a);
 } catch (e) { toast(e.message || 'Téléchargement impossible', 'error'); }
 });
 actions.appendChild(dlBtn);

 // Delete button — only own uploads
 if (doc.uploader_id === userId) {
 const delBtn = document.createElement('button');
 delBtn.className = 'doc-btn del';
 delBtn.title = 'Supprimer';
 delBtn.setAttribute('aria-label', 'Supprimer ' + doc.file_name);
 const delSvg = makeSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>');
 delBtn.appendChild(delSvg);
 delBtn.addEventListener('click', async () => {
 if (!confirm('Supprimer "' + doc.file_name + '" ?')) return;
 try {
 await deleteClientDoc(doc.id, doc.storage_path);
 row.remove();
 toast('Document supprimé', 'success');
 onDelete();
 } catch (e) { toast(e.message || 'Erreur suppression', 'error'); }
 });
 actions.appendChild(delBtn);
 }

 row.appendChild(actions);
 return row;
 }

 // ── SVG helper ────────────────────────────────────────
 function makeSvg(innerPaths) {
 const svgNS = 'http://www.w3.org/2000/svg';
 const svg = document.createElementNS(svgNS,'svg');
 svg.setAttribute('width','14'); svg.setAttribute('height','14');
 svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none');
 svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','2.5');
 svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
 svg.setAttribute('aria-hidden','true');
 // innerPaths is static (not user data)
 const tmp = document.createElement('div');
 tmp.innerHTML = '<svg>' + innerPaths + '</svg>';
 [...tmp.firstChild.childNodes].forEach(n => svg.appendChild(n.cloneNode(true)));
 return svg;
 }

 // ── Zone upload ──────────────────────────────────────
 function makeUploadZone(demandeId, body, counterEl, userId) {
 const wrap = document.createElement('div');

 // Type selector
 const chips = document.createElement('div');
 chips.className = 'type-chips';
 let selectedType = 'plan';
 const TYPES = [['plan','Plan'],['photo','Photo'],['autre','Autre']];
 TYPES.forEach(([val, label], i) => {
 const chip = document.createElement('span');
 chip.className = 'type-chip' + (i === 0 ? ' active' : '');
 chip.dataset.type = val;
 chip.textContent = label;
 chip.addEventListener('click', () => {
 chips.querySelectorAll('.type-chip').forEach(c => c.classList.remove('active'));
 chip.classList.add('active');
 selectedType = val;
 });
 chips.appendChild(chip);
 });
 wrap.appendChild(chips);

 // Drop zone
 const zone = document.createElement('div');
 zone.className = 'upload-zone';
 zone.tabIndex = 0;
 zone.setAttribute('role','button');
 zone.setAttribute('aria-label','Ajouter un fichier au dossier');

 const zoneIcon = document.createElement('div');
 zoneIcon.className = 'upload-zone-icon';
 zoneIcon.appendChild(makeSvg('<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'));

 const zoneText = document.createElement('div');
 zoneText.className = 'upload-zone-text';
 const strong = document.createElement('strong');
 strong.textContent = 'Ajouter un fichier';
 const hint = document.createElement('span');
 hint.textContent = 'PDF, image · max 20 Mo';
 zoneText.appendChild(strong); zoneText.appendChild(hint);

 const fileInput = document.createElement('input');
 fileInput.type = 'file'; fileInput.accept = '.pdf,image/*';
 fileInput.style.display = 'none';

 zone.appendChild(zoneIcon); zone.appendChild(zoneText); zone.appendChild(fileInput);
 wrap.appendChild(zone);

 // Progress bar
 const prog = document.createElement('div');
 prog.className = 'upload-progress hidden';
 const fill = document.createElement('div');
 fill.className = 'upload-progress-fill';
 prog.appendChild(fill);
 wrap.appendChild(prog);

 const triggerPick = () => fileInput.click();
 zone.addEventListener('click', triggerPick);
 zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') triggerPick(); });
 zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
 zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
 zone.addEventListener('drop', e => {
 e.preventDefault(); zone.classList.remove('drag-over');
 if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
 });
 fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

 async function handleFile(file) {
 zone.style.pointerEvents = 'none';
 prog.classList.remove('hidden'); fill.style.width = '30%';
 try {
 fill.style.width = '60%';
 const doc = await uploadClientDoc(demandeId, file, selectedType);
 fill.style.width = '100%';
 setTimeout(() => { prog.classList.add('hidden'); fill.style.width = '0%'; }, 400);

 const row = makeDocRow(doc, userId, updateCounter);
 const emptyDiv = body.querySelector('.empty-docs');
 if (emptyDiv) emptyDiv.remove();
 body.insertBefore(row, wrap);
 updateCounter();
 toast('Fichier ajouté', 'success');
 } catch (err) {
 toast(err.message || 'Erreur upload', 'error');
 prog.classList.add('hidden'); fill.style.width = '0%';
 } finally {
 zone.style.pointerEvents = '';
 fileInput.value = '';
 }
 }

 function updateCounter() {
 const cnt = body.querySelectorAll('.doc-row').length;
 if (counterEl) counterEl.textContent = cnt + ' fichier' + (cnt > 1 ? 's' : '');
 }

 return wrap;
 }

 // ── Dossier (par demande) ─────────────────────────────
 function renderDossier(demande, docs, userId) {
 const wrapper = document.createElement('div');
 wrapper.className = 'dossier';

 const title = TYPE_TRAVAUX_LABEL[demande.type_travaux] || demande.type_travaux || 'Demande';
 const sub = [demande.code_postal, demande.adresse].filter(Boolean).join(' · ');
 const count = docs.length;

 // Head
 const head = document.createElement('div');
 head.className = 'dossier-head';

 const icon = document.createElement('div');
 icon.className = 'dossier-head-icon';
 icon.appendChild(makeSvg('<path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>'));

 const headInfo = document.createElement('div');
 headInfo.className = 'dossier-head-info';
 const titleEl = document.createElement('div');
 titleEl.className = 'dossier-title';
 titleEl.textContent = title;
 headInfo.appendChild(titleEl);
 if (sub) {
 const subEl = document.createElement('div');
 subEl.className = 'dossier-sub';
 subEl.textContent = sub;
 headInfo.appendChild(subEl);
 }

 const counterEl = document.createElement('span');
 counterEl.className = 'mq-pill mq-info';
 counterEl.textContent = count + ' fichier' + (count > 1 ? 's' : '');

 head.appendChild(icon);
 head.appendChild(headInfo);
 head.appendChild(counterEl);

 // Body
 const body = document.createElement('div');
 body.className = 'dossier-body';

 if (docs.length === 0) {
 const empty = document.createElement('div');
 empty.className = 'empty-docs';
 empty.textContent = 'Aucun fichier dans ce dossier';
 body.appendChild(empty);
 } else {
 docs.forEach(doc => {
 body.appendChild(makeDocRow(doc, userId, () => {
 const cnt = body.querySelectorAll('.doc-row').length;
 counterEl.textContent = cnt + ' fichier' + (cnt > 1 ? 's' : '');
 if (cnt === 0) {
 const empty = document.createElement('div');
 empty.className = 'empty-docs';
 empty.textContent = 'Aucun fichier dans ce dossier';
 body.insertBefore(empty, body.querySelector('.upload-zone')?.parentElement);
 }
 }));
 });
 }

 body.appendChild(makeUploadZone(demande.id, body, counterEl, userId));

 wrapper.appendChild(head);
 wrapper.appendChild(body);
 return wrapper;
 }

 function withTimeout(promise, ms, label) {
 return Promise.race([
 promise,
 new Promise((_, reject) => setTimeout(() => reject(new Error(`Timeout ${label} (${ms}ms)`)), ms))
 ]);
 }

 // ── Chargement principal ───────────────────────────────
 async function load() {
 try {
 const userId = session.user.id;
 const [demandes, allDocs] = await withTimeout(
 Promise.all([listMyDemandesWithArtisan(), listClientDocs()]),
 7000,
 'load docs'
 );

 loadingArea.classList.add('hidden');
 docsArea.classList.remove('hidden');
 docsArea.replaceChildren();

 if (!demandes.length) {
 const emptyWrap = document.createElement('div');
 emptyWrap.className = 'empty-global';
 const svgNS = 'http://www.w3.org/2000/svg';
 const emptySvg = document.createElementNS(svgNS,'svg');
 emptySvg.setAttribute('width','48'); emptySvg.setAttribute('height','48');
