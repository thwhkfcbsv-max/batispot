<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirection TikTok — BatiSpot Pro</title>
<link rel="canonical" href="https://batispot.pro/">
<!-- Fallback sans JS -->
<meta http-equiv="refresh" content="1; url=/?utm_source=tiktok&utm_medium=bio&utm_campaign=tiktok_organique">
<!-- GA4 -->
<script>/*bs-internal*/(function(){try{var q=new URLSearchParams(location.search);if(q.get('internal')==='1')localStorage.setItem('bs-internal','1');else if(q.get('internal')==='0')localStorage.removeItem('bs-internal');if(localStorage.getItem('bs-internal')==='1')window['ga-disable-G-5Z1GK4VJ4E']=true;}catch(e){}})();</script>
<script>
  var DEST = "/artisan?utm_source=tiktok&utm_medium=bio&utm_campaign=tiktok_organique";
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-5Z1GK4VJ4E', { send_page_view: false });

  // Attribution persistée pour le reste du parcours
  try {
    localStorage.setItem('bs_attr_v1', JSON.stringify({
      channel: 'Social Organique',
      source: 'tiktok',
      medium: 'bio',
      campaign: 'tiktok_organique',
      landing_page: '/tk',
      first_seen: new Date().toISOString(),
      visits_count: 1
    }));
  } catch(_) {}

  var redirected = false;
  function go(){ if(redirected) return; redirected = true; location.replace(DEST); }

  // Événement GA4 dédié = comptage dur des clics depuis la bio TikTok.
  // transport 'beacon' : l'event part même quand la page se ferme pour rediriger.
  gtag('event', 'tiktok_bio_click', {
    event_category: 'acquisition',
    event_label: 'bio_tiktok',
    source: 'tiktok',
    medium: 'bio',
    campaign: 'tiktok_organique',
    transport_type: 'beacon',
    event_callback: go
  });

  // Filet de sécurité si le callback ne se déclenche pas (bloqueur, etc.)
  setTimeout(go, 800);
</script>
</head>
<body style="font-family:system-ui,-apple-system,sans-serif;padding:2rem;text-align:center;color:#0F5132;background:#FBFCFB;">
  <p>Redirection vers BatiSpot Pro…</p>
  <p><a href="/?utm_source=tiktok&utm_medium=bio&utm_campaign=tiktok_organique" style="color:#0D9488;font-weight:bold;">Cliquez ici si la page ne s'ouvre pas automatiquement.</a></p>
</body>
</html>
